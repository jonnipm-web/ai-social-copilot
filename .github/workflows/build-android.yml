name: LEGACY — GERAR APK (DESATIVADO — incidente de segurança)

# PLAY-READINESS-18 — DISABLED, DO NOT RE-ENABLE.
#
# This workflow used to auto-trigger on every push to `main` and:
#   - discarded the real, committed android/ folder via
#     `flutter create --platforms android`, rebuilding from a bare
#     template that has NONE of this project's actual Android config
#     (16KB page-size fix, correct applicationId defaultConfig, manifest,
#     permissions, etc.);
#   - signed the resulting APK using secrets.KEYSTORE_BASE64 and related
#     secrets -- the same secret names generate-keystore.yml's own
#     (compromised, plaintext-password) output was meant to populate. See
#     that file's own disabled-workflow comment for the full incident.
#
# The correct, currently-active CI gate for this project is
# .github/workflows/flutter-validation.yml, which builds DEBUG only from
# the real committed android/ folder and explicitly does not touch any
# release-signing secret.
#
# The trigger below is intentionally removed so this workflow can never
# run, accidentally or otherwise, while it remains in the repository for
# historical/audit reference.
on:
  workflow_dispatch:
    inputs:
      disabled_notice:
        description: "This workflow is permanently disabled -- see the comment at the top of this file."
        required: false
        default: "disabled"

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to run
        run: |
          echo "This workflow is permanently disabled due to a security incident."
          echo "See the comment block at the top of .github/workflows/build-android.yml"
          echo "Use flutter-validation.yml (debug-only, real android/ folder) instead."
          exit 1
