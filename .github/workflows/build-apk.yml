name: BUILD WEEK — VALIDAR E GERAR APK

on:
  workflow_dispatch:

jobs:
  validate-functions:
    name: Testes Deno — Edge Functions
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Instalar Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x

      - name: Testes da Edge Function context-copilot
        run: deno test --allow-env supabase/functions/context-copilot/index_test.ts

      - name: Testes da Edge Function ive-agent-runner
        run: deno test --allow-env supabase/functions/ive-agent-runner/index_test.ts

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Flutter (versao estavel mais recente)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Criar arquivo .env com as credenciais
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env

      - name: Instalar dependências
        run: flutter pub get

      - name: Análise estática (flutter analyze)
        # --fatal-warnings: warnings são tratados como erros — nenhum é ocultado
        run: flutter analyze --no-pub --fatal-warnings

      - name: Testes unitários e de integração (flutter test)
        # --reporter=expanded: exibe nome de cada teste (sem omitir resultados)
        run: flutter test --no-pub --reporter=expanded

  build:
    runs-on: ubuntu-latest
    needs: [validate, validate-functions]

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Java (necessário para Android)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Flutter (versao estavel mais recente)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Criar arquivo .env com as credenciais
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env

      - name: Adicionar suporte à plataforma Android
        run: flutter create --platforms android --project-name ai_social_copilot .

      - name: Fixar AGP para 8.11.1 (compativel com Flutter Gradle plugin)
        run: |
          if [ -f android/settings.gradle.kts ]; then
            sed -i 's/id("com.android.application") version "[^"]*"/id("com.android.application") version "8.11.1"/g' android/settings.gradle.kts
            sed -i 's/id("com.android.library") version "[^"]*"/id("com.android.library") version "8.11.1"/g' android/settings.gradle.kts
            echo "=== settings.gradle.kts ===" && cat android/settings.gradle.kts
          fi

      - name: Patch MainActivity — FlutterFragmentActivity (local_auth)
        run: |
          MAIN=$(find android/app/src/main/kotlin -name "MainActivity.kt" 2>/dev/null | head -1)
          if [ -n "$MAIN" ]; then
            sed -i 's/import io\.flutter\.embedding\.android\.FlutterActivity/import io.flutter.embedding.android.FlutterFragmentActivity/g' "$MAIN"
            sed -i 's/: FlutterActivity()/: FlutterFragmentActivity()/g' "$MAIN"
            echo "=== $MAIN ===" && cat "$MAIN"
            grep -q 'FlutterFragmentActivity' "$MAIN" && echo "PATCH OK" || echo "PATCH FALHOU — verificar manualmente"
          else
            echo "MainActivity.kt not found — skipping patch"
          fi

      - name: Configurar keystore release persistente
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          echo "Keystore decodificado com sucesso"
          GRADLE=android/app/build.gradle.kts
          sed -i 's/    buildTypes {/    signingConfigs {\n        create("release") {\n            storeFile = file("release.keystore")\n            storePassword = System.getenv("KEYSTORE_STORE_PASSWORD")\n            keyAlias = System.getenv("KEYSTORE_KEY_ALIAS")\n            keyPassword = System.getenv("KEYSTORE_KEY_PASSWORD")\n        }\n    }\n    buildTypes {/' "$GRADLE"
          sed -i 's/signingConfig = signingConfigs.getByName("debug")/signingConfig = signingConfigs.getByName("release")/' "$GRADLE"
          echo "=== build.gradle.kts ===" && cat "$GRADLE"

      - name: Imprimir fingerprint SHA-1 e SHA-256 da keystore release
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
        run: |
          echo "=== CERTIFICATE FINGERPRINTS — registrar no Google Cloud Console ==="
          keytool -list -v \
            -keystore android/app/release.keystore \
            -alias "$KEYSTORE_KEY_ALIAS" \
            -storepass "$KEYSTORE_STORE_PASSWORD" \
            2>/dev/null | grep -E "SHA1:|SHA256:"
          echo "=== APPLICATION ID ==="
          grep -r "applicationId\|namespace" android/app/build.gradle.kts | head -5

      - name: Instalar dependências
        run: flutter pub get

      - name: Corrigir file_picker para AGP 8.x (jcenter e namespace se necessario)
        run: |
          find ~/.pub-cache -path "*/file_picker-*/android/build.gradle" | while read f; do
            sed -i 's/jcenter()/mavenCentral()/g' "$f"
            if ! grep -q 'namespace' "$f"; then
              sed -i '/^android {/a\    namespace "com.mr.flutter.plugin.filepicker"' "$f"
            fi
            echo "=== $f ===" && cat "$f"
          done

      - name: Build do APK
        env:
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Salvar APK como artefato para download
        uses: actions/upload-artifact@v4
        with:
          name: ai-social-copilot-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  build-web:
    runs-on: ubuntu-latest
    needs: [validate, validate-functions]

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Flutter (versao estavel mais recente)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Criar arquivo .env com as credenciais
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env

      - name: Adicionar suporte à plataforma Web
        run: flutter create --platforms web --project-name ai_social_copilot .

      - name: Instalar dependências
        run: flutter pub get

      - name: Build Web (gate multiplataforma)
        run: flutter build web --no-pub --release
