name: BUILD APK — AI Social Copilot

on:
  workflow_dispatch:
  push:
    branches:
      - claude/knowledge-projects-analysis-p0-pjd230
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Flutter 3.44.8
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Criar arquivo .env com as credenciais do Supabase
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env

      - name: Instalar dependências
        run: flutter pub get

      - name: Validar código (flutter analyze)
        run: flutter analyze --no-pub || true

      - name: Rodar testes unitários
        run: flutter test --no-pub

      - name: Build APK debug
        run: flutter build apk --debug --no-pub

      - name: Salvar APK debug como artefato
        uses: actions/upload-artifact@v4
        with:
          name: ai-social-copilot-debug-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      - name: Build APK release (somente se keystore configurado)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          flutter build apk --release \
            -Pandroid.injected.signing.store.file="$(pwd)/android/app/release.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEYSTORE_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEYSTORE_KEY_PASSWORD"

      - name: Salvar APK release como artefato
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ai-social-copilot-release-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
