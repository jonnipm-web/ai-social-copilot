name: BUILD WEEK — VALIDAR E GERAR APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Java (necessário para Android)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Flutter (versao estavel mais recente)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Criar arquivo .env com as credenciais
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env

      - name: Adicionar suporte à plataforma Android
        run: flutter create --platforms android --project-name ai_social_copilot .

      - name: Fixar AGP para 8.11.1 (compativel com Flutter Gradle plugin)
        run: |
          if [ -f android/settings.gradle.kts ]; then
            sed -i 's/id("com.android.application") version "[^"]*"/id("com.android.application") version "8.11.1"/g' android/settings.gradle.kts
            sed -i 's/id("com.android.library") version "[^"]*"/id("com.android.library") version "8.11.1"/g' android/settings.gradle.kts
            echo "=== settings.gradle.kts ===" && cat android/settings.gradle.kts
          fi

      - name: Instalar dependências
        run: flutter pub get

      - name: Corrigir file_picker para AGP 8.x (jcenter e namespace se necessario)
        run: |
          find ~/.pub-cache -path "*/file_picker-*/android/build.gradle" | while read f; do
            sed -i 's/jcenter()/mavenCentral()/g' "$f"
            if ! grep -q 'namespace' "$f"; then
              sed -i '/^android {/a\    namespace "com.mr.flutter.plugin.filepicker"' "$f"
            fi
            echo "=== $f ===" && cat "$f"
          done

      - name: Configurar assinatura consistente do APK
        env:
          KEYSTORE_BASE64:     ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS:           ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEY_STORE_PASSWORD:  ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEY_PASSWORD:        ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          # Decodifica o keystore salvo como secret
          echo "$KEYSTORE_BASE64" | base64 -d > android/keystore.jks

          # Cria o arquivo key.properties que o Gradle vai ler
          cat > android/key.properties << EOF
          storePassword=${KEY_STORE_PASSWORD}
          keyPassword=${KEY_PASSWORD}
          keyAlias=${KEY_ALIAS}
          storeFile=../keystore.jks
          EOF

          # Injeta signingConfig no build.gradle.kts gerado pelo flutter create
          python3 << 'PYEOF'
          with open('android/app/build.gradle.kts', 'r') as f:
              content = f.read()

          # Imports necessários para ler key.properties
          imports = 'import java.util.Properties\nimport java.io.FileInputStream\n\n'
          if 'import java.util.Properties' not in content:
              content = imports + content

          # Bloco que carrega o keystore antes do bloco android {}
          keystore_loader = '''
          val keystorePropertiesFile = rootProject.file("key.properties")
          val keystoreProperties = Properties().apply {
              if (keystorePropertiesFile.exists()) load(FileInputStream(keystorePropertiesFile))
          }

          '''
          if 'keystoreProperties' not in content:
              content = content.replace('android {', keystore_loader + 'android {', 1)

          # Bloco signingConfigs inserido antes de buildTypes
          signing_block = '''
              signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = keystoreProperties["storeFile"]?.let { file(it) }
                      storePassword = keystoreProperties["storePassword"] as String
                  }
              }
          '''
          if 'signingConfigs' not in content:
              content = content.replace('    buildTypes {', signing_block + '    buildTypes {', 1)

          # Substitui a chave debug pela chave release
          content = content.replace(
              'signingConfig = signingConfigs.getByName("debug")',
              'signingConfig = signingConfigs.getByName("release")'
          )

          with open('android/app/build.gradle.kts', 'w') as f:
              f.write(content)

          print('✓ build.gradle.kts configurado com assinatura de release')
          PYEOF

      - name: Build do APK assinado
        run: flutter build apk --release

      - name: Salvar APK como artefato para download
        uses: actions/upload-artifact@v4
        with:
          name: ai-social-copilot-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
