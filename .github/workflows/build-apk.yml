name: BUILD APK - AI Social Copilot

on:
  workflow_dispatch:
  push:
    branches:
      - claude/knowledge-projects-analysis-p0-pjd230
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Criar arquivo .env com credenciais Supabase
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env

      - name: Instalar dependencias
        run: flutter pub get

      - name: Rodar testes unitarios
        run: flutter test --no-pub

      - name: Build APK debug
        run: flutter build apk --debug --no-pub

      - name: Salvar APK debug como artefato
        uses: actions/upload-artifact@v4
        with:
          name: ai-social-copilot-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
