name: BUILD WEEK — VALIDAR E GERAR APK (DESATIVADO — incidente de segurança)

# PLAY-READINESS-18 — DISABLED, DO NOT RE-ENABLE.
#
# Same class of issue as build-android.yml (see that file's comment for
# the full incident): discards the real android/ folder via
# `flutter create --platforms android` and signs using
# secrets.KEYSTORE_BASE64 and related secrets, whose source
# (generate-keystore.yml) committed the keystore password in plaintext.
#
# The correct, currently-active CI gate for this project is
# .github/workflows/flutter-validation.yml, which builds DEBUG only from
# the real committed android/ folder and explicitly does not touch any
# release-signing secret.
#
# The trigger below is intentionally removed so this workflow can never
# run, accidentally or otherwise, while it remains in the repository for
# historical/audit reference.
on:
  workflow_dispatch:
    inputs:
      disabled_notice:
        description: "This workflow is permanently disabled -- see the comment at the top of this file."
        required: false
        default: "disabled"

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to run
        run: |
          echo "This workflow is permanently disabled due to a security incident."
          echo "See the comment block at the top of .github/workflows/build-apk.yml"
          echo "Use flutter-validation.yml (debug-only, real android/ folder) instead."
          exit 1
