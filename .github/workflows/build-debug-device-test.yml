name: Build APK Debug — Device Test

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or SHA to build from (default: main)'
        required: false
        default: 'main'

jobs:
  build:
    name: Build debug APK com credenciais reais
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Criar .env com credenciais reais
        run: |
          echo "SUPABASE_URL=https://nzngvbajrnruknpzzjbf.supabase.co" > .env
          echo "SUPABASE_ANON_KEY=sb_publishable_fZboVtE9PeokahlYmhc_vg_t6JHOmFh" >> .env
          echo "GOOGLE_CLIENT_ID=placeholder.apps.googleusercontent.com" >> .env

      - name: flutter pub get
        run: flutter pub get

      - name: Build APK debug
        run: flutter build apk --debug

      - name: Record build provenance
        run: |
          SOURCE_SHA=$(git rev-parse HEAD)
          APK_PATH=build/app/outputs/flutter-apk/app-debug.apk
          APK_SHA256=$(sha256sum "$APK_PATH" | cut -d' ' -f1)
          APK_SIZE=$(stat -c%s "$APK_PATH")
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "APK_SHA256=$APK_SHA256" >> "$GITHUB_STEP_SUMMARY"
          echo "APK_SIZE_BYTES=$APK_SIZE" >> "$GITHUB_STEP_SUMMARY"
          echo "BUILD_REF=${{ inputs.ref || 'main' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "---"
          echo "SOURCE_SHA=$SOURCE_SHA"
          echo "APK_SHA256=$APK_SHA256"
          echo "APK_SIZE_BYTES=$APK_SIZE"

      - name: Upload APK debug
        uses: actions/upload-artifact@v4
        with:
          name: ive-debug-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
          if-no-files-found: error
