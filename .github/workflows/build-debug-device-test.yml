name: Build APK Debug — Device Test

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or SHA to build from (default: current branch)'
        required: false
        default: ''
      # IV-MOBILE-ECOSYSTEM-FOUNDATION-01 (P1-R11-A fix): with three product
      # flavors, the unflavored `flutter build apk --debug` is no longer valid.
      # Select an explicit flavor; the produced APK is flavor-specific.
      flavor:
        description: 'Product flavor to build (core | impact | quant)'
        required: false
        default: 'core'
        type: choice
        options:
          - core
          - impact
          - quant

jobs:
  build:
    name: Build debug APK com credenciais reais
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # P2-R12-A fix: default to the dispatching branch (github.ref) so the
          # workflow builds the correct flavor entry points without requiring an
          # explicit ref override before the branch is merged to main.
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Criar flutter_env.cfg com credenciais reais
        run: |
          echo "SUPABASE_URL=https://nzngvbajrnruknpzzjbf.supabase.co" > flutter_env.cfg
          echo "SUPABASE_ANON_KEY=sb_publishable_fZboVtE9PeokahlYmhc_vg_t6JHOmFh" >> flutter_env.cfg
          echo "GOOGLE_CLIENT_ID=placeholder.apps.googleusercontent.com" >> flutter_env.cfg

      - name: flutter pub get
        run: flutter pub get

      - name: Build APK debug (${{ inputs.flavor || 'core' }})
        run: |
          FLAVOR="${{ inputs.flavor || 'core' }}"
          flutter build apk --debug --flavor "$FLAVOR" -t "lib/main_${FLAVOR}.dart"

      - name: Record build provenance
        run: |
          FLAVOR="${{ inputs.flavor || 'core' }}"
          SOURCE_SHA=$(git rev-parse HEAD)
          APK_PATH="build/app/outputs/flutter-apk/app-${FLAVOR}-debug.apk"
          APK_SHA256=$(sha256sum "$APK_PATH" | cut -d' ' -f1)
          APK_SIZE=$(stat -c%s "$APK_PATH")
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "APK_SHA256=$APK_SHA256" >> "$GITHUB_STEP_SUMMARY"
          echo "APK_SIZE_BYTES=$APK_SIZE" >> "$GITHUB_STEP_SUMMARY"
          echo "BUILD_REF=${{ inputs.ref || github.ref }}" >> "$GITHUB_STEP_SUMMARY"
          echo "FLAVOR=$FLAVOR" >> "$GITHUB_STEP_SUMMARY"
          echo "---"
          echo "SOURCE_SHA=$SOURCE_SHA"
          echo "APK_SHA256=$APK_SHA256"
          echo "APK_SIZE_BYTES=$APK_SIZE"
          echo "FLAVOR=$FLAVOR"

      - name: Upload APK debug (${{ inputs.flavor || 'core' }})
        uses: actions/upload-artifact@v4
        with:
          name: ive-${{ inputs.flavor || 'core' }}-debug-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-${{ inputs.flavor || 'core' }}-debug.apk
          retention-days: 30
          if-no-files-found: error
