name: Build APK Debug — Device Test

on:
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK com credenciais reais
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/ive-avatar-v2-build-recovery

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Criar .env com credenciais reais
        run: |
          echo "SUPABASE_URL=https://nzngvbajrnruknpzzjbf.supabase.co" > .env
          echo "SUPABASE_ANON_KEY=sb_publishable_fZboVtE9PeokahlYmhc_vg_t6JHOmFh" >> .env
          echo "GOOGLE_CLIENT_ID=placeholder.apps.googleusercontent.com" >> .env

      - name: flutter pub get
        run: flutter pub get

      - name: Build APK debug
        run: flutter build apk --debug

      - name: Upload APK debug
        uses: actions/upload-artifact@v4
        with:
          name: ive-avatar-v2-device-test-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
          if-no-files-found: error
