name: Build Release AAB

# IV-CORE-MOBILE-COMMERCIAL-01 — secure release bundle build.
#
# Produces a signed Android App Bundle (AAB) for a product flavor.
# The keystore is stored exclusively in GitHub Secrets — never committed.
#
# PREREQUISITE (BLOCKED_OWNER — must be done by Owner before first use):
#   1. Generate upload keystore locally (see android/key.properties.template).
#   2. Store in repository GitHub Secrets (Settings → Secrets → Actions):
#        KEYSTORE_BASE64         — base64 of upload-keystore.jks
#        KEYSTORE_STORE_PASSWORD — store password
#        KEYSTORE_KEY_ALIAS      — alias (e.g. "upload")
#        KEYSTORE_KEY_PASSWORD   — key password
#        GOOGLE_CLIENT_ID        — Android Web OAuth 2.0 client ID
#                                  (format: <digits>.apps.googleusercontent.com)
#   3. Create a GitHub protected environment named "release-signing":
#        Settings → Environments → release-signing
#          - Required reviewers: Owner (Paulo)
#          - Deployment branches: main only (Selected branches → main)
#        This provides the authoritative ref restriction at the GitHub API
#        level, independent of the inline ref-guard step.
#   4. Pin actions/upload-artifact to an immutable SHA before production use:
#        npx pin-github-action .github/workflows/build-release-aab.yml
#
# SECURITY: KEYSTORE_* secrets previously populated from the now-disabled
# generate-keystore.yml (PLAY-READINESS-18 incident) MUST be rotated by
# the Owner before this workflow is used.
#
# Security properties (Codex R1–R9):
#   - workflow_dispatch only (no PR/push triggers).
#   - Restricted to refs/heads/main via job-level if: (layer 1) and an
#     early inline ref-guard step via env: (layer 2 — P1-C05-A fix).
#     Tags removed: only main is trusted as a release ref.
#   - Protected by the release-signing GitHub environment (requires Owner
#     manual approval before any step runs — BLOCKED_OWNER to configure).
#   - inputs.flavor validated via env: + case allowlist before any secrets
#     are materialized; exported as step output for reliable use in action
#     `with:` fields (P1-C06-B / P1-C07-A fix).
#   - Signing secrets created AFTER pub get — minimizes exposure window
#     (P2-C07-C fix).
#   - All secrets written via env: variables + Python/printf, never
#     interpolated directly into shell bodies (P1-C02-B fix).
#   - Flutter installed from official Google storage with archive SHA-256
#     verified against the official releases manifest (P1-C04-B / P2-C05-C).
#   - actions/checkout pinned to immutable SHA 11bd71901bbe5b1630ceea73d27597364c9af683
#     (v4.2.2) — verified against github.com/actions/checkout releases.
#   - actions/setup-java eliminated; Java 17 pre-installed on ubuntu-latest
#     used via $JAVA_HOME_17_X64 (eliminates mutable third-party action).
#   - Minimum permissions: contents: read (P1-C04-B).
#   - Keystore and key.properties removed in an always-run cleanup step.
#
# BLOCKED_OWNER — action SHA pinning (P1 residual after Codex R9):
#   actions/upload-artifact@v4.3.3 is pinned below. Owner MUST verify
#   this SHA matches the intended release at github.com/actions/upload-artifact
#   before enabling production signing, and run:
#     npx pin-github-action .github/workflows/build-release-aab.yml
#   to refresh all SHAs using a current tool.

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: 'Product flavor to build'
        required: true
        default: 'core'
        type: choice
        options:
          - core
          - impact
          - quant
      ecosystem_gate_run_id:
        description: 'Run ID from the Mobile Ecosystem Release Gate PASS (release-mobile-ecosystem.yml). Copy from the gate run URL: github.com/.../actions/runs/<RUN_ID>. The build verifies via GitHub API that this run succeeded against the same commit.'
        required: true
        type: string

# Only allow one release build at a time per flavor.
concurrency:
  group: release-aab-${{ inputs.flavor }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build release AAB (${{ inputs.flavor }})
    # Pin to ubuntu-22.04 for toolchain stability (P2-C10-B fix).
    # ubuntu-latest is mutable; ubuntu-22.04 images are updated monthly but
    # do not have major toolchain removals without deprecation notice.
    runs-on: ubuntu-22.04

    # Defense-in-depth layer 1: job-level conditional evaluated before ANY
    # step executes. The job is skipped entirely (including actions/checkout)
    # when dispatched from a non-main ref.
    if: github.ref == 'refs/heads/main'

    # Least-privilege permissions — no write access needed (P1-C04-B fix).
    # IV-MOBILE-ECOSYSTEM-RELEASE-CLOSURE-01 / Codex R3 P1-B: actions: read
    # is required to verify the ecosystem gate run via the GitHub API.
    permissions:
      contents: read
      actions: read

    # Defense-in-depth layer 0: GitHub protected environment.
    # BLOCKED_OWNER: configure in Settings → Environments → release-signing
    #   - Required reviewers: Owner
    #   - Deployment branches: main only
    environment: release-signing

    steps:
      # IV-MOBILE-ECOSYSTEM-RELEASE-CLOSURE-01 / Codex R3 P1-B:
      # Machine-verifiable ecosystem gate enforcement via GitHub API.
      # Verifies that:
      #   1. The run ID corresponds to a real Actions run (not operator-guessed).
      #   2. The run is from release-mobile-ecosystem.yml (not a different workflow).
      #   3. The run concluded successfully.
      #   4. The run's head_sha matches the current build commit.
      # This prevents building a signed AAB without a successful gate run at the
      # same commit that validated all signing secrets via keytool.
      - name: Verify ecosystem gate run (GitHub API)
        env:
          GATE_RUN_ID: ${{ inputs.ecosystem_gate_run_id }}
          CURRENT_SHA: ${{ github.sha }}
          REPO:        ${{ github.repository }}
          GH_TOKEN:    ${{ github.token }}
        run: |
          if [ -z "$GATE_RUN_ID" ]; then
            echo "::error::RELEASE BLOCKED: ecosystem_gate_run_id is empty."
            echo "::error::Run release-mobile-ecosystem.yml first, then copy the run ID from its URL."
            exit 1
          fi

          RUN_DATA=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/runs/$GATE_RUN_ID")

          WORKFLOW_NAME=$(echo "$RUN_DATA" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          print(d.get('name', ''))
          ")
          if [ "$WORKFLOW_NAME" != "Mobile Ecosystem Release Gate" ]; then
            echo "::error::RELEASE BLOCKED: run $GATE_RUN_ID is not from the Mobile Ecosystem Release Gate (got: '$WORKFLOW_NAME')."
            exit 1
          fi

          CONCLUSION=$(echo "$RUN_DATA" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          print(d.get('conclusion', ''))
          ")
          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::RELEASE BLOCKED: ecosystem gate run $GATE_RUN_ID did not succeed (conclusion: '$CONCLUSION')."
            exit 1
          fi

          GATE_SHA=$(echo "$RUN_DATA" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          print(d.get('head_sha', ''))
          ")
          if [ "$GATE_SHA" != "$CURRENT_SHA" ]; then
            echo "::error::RELEASE BLOCKED: gate run $GATE_RUN_ID was for commit $GATE_SHA but this build is at $CURRENT_SHA."
            echo "::error::Re-run release-mobile-ecosystem.yml at the current main tip before building."
            exit 1
          fi

          echo "Ecosystem gate verification: OK (run $GATE_RUN_ID: success, SHA $GATE_SHA)"

      # Layer 2: hard ref guard. github.ref via env:, NOT interpolated into
      # the shell body (P1-C05-A fix — prevents injection via crafted branch
      # names with shell metacharacters). Runs before checkout or secrets.
      - name: Enforce main-only release ref
        env:
          GUARD_REF: ${{ github.ref }}
        run: |
          if [ "$GUARD_REF" != "refs/heads/main" ]; then
            echo "::error::RELEASE BLOCKED: dispatched from an untrusted ref."
            echo "::error::Only refs/heads/main is allowed for release builds."
            exit 1
          fi
          echo "Release ref check: OK (refs/heads/main)"

      # P1-C06-B / P1-C07-A fix: validate inputs.flavor via env: + case
      # allowlist BEFORE any secrets are materialized. Exported as a step
      # output for reliable use in action `with:` fields.
      - name: Validate and normalize flavor input
        id: validate-flavor
        env:
          INPUT_FLAVOR: ${{ inputs.flavor }}
        run: |
          case "$INPUT_FLAVOR" in
            core|impact|quant)
              echo "flavor=$INPUT_FLAVOR" >> "$GITHUB_OUTPUT"
              echo "FLAVOR=$INPUT_FLAVOR" >> "$GITHUB_ENV"
              echo "Flavor validation: OK ($INPUT_FLAVOR)"
              ;;
            *)
              echo "::error::RELEASE BLOCKED: unknown flavor — must be core, impact, or quant."
              exit 1
              ;;
          esac

      # P1-C07-B fix: pinned to immutable commit SHA (v4.2.2).
      # SHA 11bd71901bbe5b1630ceea73d27597364c9af683 verified against
      # https://github.com/actions/checkout/releases/tag/v4.2.2
      # BLOCKED_OWNER: re-verify when updating checkout version.
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      # P1-C07-B fix: eliminates actions/setup-java@v4 mutable tag.
      # ubuntu-latest runners provide Java 17 pre-installed; $JAVA_HOME_17_X64
      # is a documented runner variable guaranteed on ubuntu-22.04+.
      - name: Use Java 17 (pre-installed on ubuntu-latest)
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME_17_X64/bin/java" -version

      # P1-C04-B / P2-C05-C fix: Flutter installed from official Google
      # storage at a pinned version, SHA-256 verified against the official
      # Flutter releases manifest before extraction.
      - name: Install Flutter 3.47.4 (stable, SHA-256 verified)
        run: |
          FLUTTER_VERSION="3.47.4"
          RELEASES_URL="https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json"
          ARCHIVE_URL="https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"

          EXPECTED_SHA256=$(curl -fsSL "$RELEASES_URL" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          target = '${FLUTTER_VERSION}'
          for r in data.get('releases', []):
              if r.get('version') == target and r.get('channel') == 'stable':
                  print(r.get('sha256', ''))
                  break
          ")

          if [ -z "$EXPECTED_SHA256" ]; then
            echo "::error::Flutter ${FLUTTER_VERSION} SHA-256 not in releases manifest."
            exit 1
          fi

          curl -fsSL "$ARCHIVE_URL" -o flutter.tar.xz
          ACTUAL_SHA256=$(sha256sum flutter.tar.xz | cut -d' ' -f1)

          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "::error::Flutter archive integrity check FAILED."
            echo "::error::Expected: $EXPECTED_SHA256  Actual: $ACTUAL_SHA256"
            rm -f flutter.tar.xz
            exit 1
          fi

          echo "Flutter archive integrity: OK ($ACTUAL_SHA256)"
          tar xf flutter.tar.xz
          rm flutter.tar.xz
          echo "$GITHUB_WORKSPACE/flutter/bin" >> "$GITHUB_PATH"
          flutter/bin/flutter config --no-analytics
          flutter/bin/flutter precache --android --no-ios --no-web

      - name: flutter pub get
        run: flutter pub get

      # P1-C01-B + P2-C02-C fix: validate GOOGLE_CLIENT_ID before signing.
      - name: Validate release configuration (GOOGLE_CLIENT_ID)
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          if [ -z "$GOOGLE_CLIENT_ID" ]; then
            echo "::error::RELEASE BLOCKED: GOOGLE_CLIENT_ID secret is missing."
            exit 1
          fi
          if [ "$GOOGLE_CLIENT_ID" = "placeholder.apps.googleusercontent.com" ]; then
            echo "::error::RELEASE BLOCKED: GOOGLE_CLIENT_ID is a placeholder value."
            exit 1
          fi
          if ! echo "$GOOGLE_CLIENT_ID" | grep -qE '^[0-9]+-[a-z0-9]+\.apps\.googleusercontent\.com$'; then
            echo "::error::RELEASE BLOCKED: GOOGLE_CLIENT_ID format is invalid."
            exit 1
          fi
          echo "GOOGLE_CLIENT_ID validation: OK"

      # P2-C07-C fix: signing material created AFTER pub get, minimizing the
      # window during which secrets exist in the workspace.
      #
      # P1-C01-A fix: flutter_env.cfg is a RUNTIME ASSET read by flutter_dotenv.
      # P1-C02-B fix: GOOGLE_CLIENT_ID via env:, never shell-interpolated.
      - name: Create flutter_env.cfg (runtime asset)
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          printf 'SUPABASE_URL=https://nzngvbajrnruknpzzjbf.supabase.co\n' > flutter_env.cfg
          printf 'SUPABASE_ANON_KEY=sb_publishable_fZboVtE9PeokahlYmhc_vg_t6JHOmFh\n' >> flutter_env.cfg
          printf 'GOOGLE_CLIENT_ID=%s\n' "$GOOGLE_CLIENT_ID" >> flutter_env.cfg

      # P1-C02-B fix: keystore decoded from env var.
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks

      # IV-MOBILE-ECOSYSTEM-RELEASE-CLOSURE-01 / Codex R1 P1-A + R2 P2:
      # Verify the decoded JKS/PKCS12 keystore is valid with the configured
      # store password, alias, AND key password before Gradle signs the AAB.
      # Fails fast rather than after a long Flutter build.
      - name: Validate keystore credentials (keytool)
        env:
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS:      ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD:   ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          # Validate store password + alias.
          keytool -list \
            -keystore android/upload-keystore.jks \
            -storepass "$KEYSTORE_STORE_PASSWORD" \
            -alias "$KEYSTORE_KEY_ALIAS" 2>&1
          if [ $? -ne 0 ]; then
            echo "::error::RELEASE BLOCKED: keystore invalid or credentials do not match — check KEYSTORE_STORE_PASSWORD / KEYSTORE_KEY_ALIAS."
            exit 1
          fi

          # Validate key password via CSR generation (accesses private key).
          keytool -certreq \
            -alias "$KEYSTORE_KEY_ALIAS" \
            -keystore android/upload-keystore.jks \
            -storepass "$KEYSTORE_STORE_PASSWORD" \
            -keypass "$KEYSTORE_KEY_PASSWORD" \
            -file /dev/null 2>&1
          if [ $? -ne 0 ]; then
            echo "::error::RELEASE BLOCKED: wrong KEYSTORE_KEY_PASSWORD for alias $KEYSTORE_KEY_ALIAS."
            exit 1
          fi
          echo "Keystore validation: OK (store password, alias, and key password all correct)"

      # P1-C02-B fix: key.properties written via Python os.environ.
      - name: Create key.properties
        env:
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
        run: |
          python3 - <<'PYEOF'
          import os
          lines = [
              f"storePassword={os.environ['KEYSTORE_STORE_PASSWORD']}",
              f"keyPassword={os.environ['KEYSTORE_KEY_PASSWORD']}",
              f"keyAlias={os.environ['KEYSTORE_KEY_ALIAS']}",
              "storeFile=../upload-keystore.jks",
          ]
          with open("android/key.properties", "w") as f:
              f.write("\n".join(lines) + "\n")
          PYEOF

      # P1-C06-B / P1-C07-A fix: $FLAVOR from GITHUB_ENV (validated above).
      # P1-C01-A fix: no --dart-define-from-file.
      - name: Build release AAB
        run: |
          flutter build appbundle --release \
            --flavor "$FLAVOR" \
            -t "lib/main_${FLAVOR}.dart"

      - name: Secure cleanup — remove keystore and key.properties
        if: always()
        run: |
          rm -f android/upload-keystore.jks android/key.properties

      - name: Record build provenance
        run: |
          SOURCE_SHA=$(git rev-parse HEAD)
          AAB_PATH="build/app/outputs/bundle/${FLAVOR}Release/app-${FLAVOR}-release.aab"
          AAB_SHA256=$(sha256sum "$AAB_PATH" | cut -d' ' -f1)
          AAB_SIZE=$(stat -c%s "$AAB_PATH")
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "AAB_SHA256=$AAB_SHA256" >> "$GITHUB_STEP_SUMMARY"
          echo "AAB_SIZE_BYTES=$AAB_SIZE" >> "$GITHUB_STEP_SUMMARY"
          echo "FLAVOR=$FLAVOR" >> "$GITHUB_STEP_SUMMARY"

      # P1-C07-A fix: uses steps.validate-flavor.outputs.flavor (step output).
      # BLOCKED_OWNER (SHA pinning): SHA a8a3f3ad30e3422c9c7b888a15615d19a852ae32
      # is pinned for v4.3.3. Owner MUST verify this SHA against
      # https://github.com/actions/upload-artifact/releases/tag/v4.3.3
      # and run `npx pin-github-action` to refresh before production use.
      - name: Upload release AAB
        uses: actions/upload-artifact@a8a3f3ad30e3422c9c7b888a15615d19a852ae32  # v4.3.3
        with:
          name: ive-${{ steps.validate-flavor.outputs.flavor }}-release-aab-${{ github.run_number }}
          path: build/app/outputs/bundle/${{ steps.validate-flavor.outputs.flavor }}Release/app-${{ steps.validate-flavor.outputs.flavor }}-release.aab
          retention-days: 30
          if-no-files-found: error
