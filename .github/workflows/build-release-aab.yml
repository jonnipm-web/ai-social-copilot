name: Build Release AAB

# IV-CORE-MOBILE-COMMERCIAL-01 — secure release bundle build.
#
# Produces a signed Android App Bundle (AAB) for a product flavor.
# The keystore is stored exclusively in GitHub Secrets — never committed.
#
# PREREQUISITE (BLOCKED_OWNER — must be done by Owner before first use):
#   1. Generate upload keystore locally (see android/key.properties.template).
#   2. Store in repository GitHub Secrets (Settings → Secrets → Actions):
#        KEYSTORE_BASE64         — base64 of upload-keystore.jks
#        KEYSTORE_STORE_PASSWORD — store password
#        KEYSTORE_KEY_ALIAS      — alias (e.g. "upload")
#        KEYSTORE_KEY_PASSWORD   — key password
#        GOOGLE_CLIENT_ID        — Android Web OAuth 2.0 client ID
#                                  (MUST NOT be the placeholder value)
#
# SECURITY: KEYSTORE_* secrets previously populated from the now-disabled
# generate-keystore.yml (PLAY-READINESS-18 incident) MUST be rotated by
# the Owner before this workflow is used.
#
# P1-C01-A fix: flutter_env.cfg is an asset file read at runtime by
#   flutter_dotenv. It is NOT a --dart-define-from-file JSON map.
#   The build command does not pass --dart-define-from-file.
#
# P1-C01-B fix: workflow fails fast if GOOGLE_CLIENT_ID is absent or is
#   still the placeholder value — a release AAB with a placeholder client
#   will silently break Google Sign-In for all users.

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: 'Product flavor to build'
        required: true
        default: 'core'
        type: choice
        options:
          - core
          - impact
          - quant
      ref:
        description: 'Branch or SHA (default: main)'
        required: false
        default: ''

jobs:
  build-release:
    name: Build release AAB (${{ inputs.flavor }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # P1-C01-B: fail fast before any build work if GOOGLE_CLIENT_ID is
      # absent or still holds the placeholder value. A release build with
      # a placeholder client ID silently breaks Google Sign-In for all users.
      - name: Validate release configuration (GOOGLE_CLIENT_ID)
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          if [ -z "$GOOGLE_CLIENT_ID" ] || \
             [ "$GOOGLE_CLIENT_ID" = "placeholder.apps.googleusercontent.com" ]; then
            echo "::error::RELEASE BLOCKED: GOOGLE_CLIENT_ID secret is missing or still"
            echo "::error::set to the placeholder value. Add the real Android Web OAuth 2.0"
            echo "::error::client ID to the repository secrets as GOOGLE_CLIENT_ID."
            exit 1
          fi
          echo "GOOGLE_CLIENT_ID validation: OK (non-placeholder value present)"

      # P1-C01-A fix: flutter_env.cfg is an ASSET FILE loaded at runtime by
      # flutter_dotenv. Do NOT pass it via --dart-define-from-file (JSON-only).
      - name: Create flutter_env.cfg (runtime asset)
        run: |
          echo "SUPABASE_URL=https://nzngvbajrnruknpzzjbf.supabase.co" > flutter_env.cfg
          echo "SUPABASE_ANON_KEY=sb_publishable_fZboVtE9PeokahlYmhc_vg_t6JHOmFh" >> flutter_env.cfg
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> flutter_env.cfg

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_STORE_PASSWORD }}
          keyPassword=${{ secrets.KEYSTORE_KEY_PASSWORD }}
          keyAlias=${{ secrets.KEYSTORE_KEY_ALIAS }}
          storeFile=../upload-keystore.jks
          EOF

      - name: flutter pub get
        run: flutter pub get

      # P1-C01-A fix: no --dart-define-from-file; flutter_env.cfg is an
      # asset bundled into the AAB, read at runtime via flutter_dotenv.
      - name: Build release AAB (${{ inputs.flavor }})
        run: |
          FLAVOR="${{ inputs.flavor }}"
          flutter build appbundle --release \
            --flavor "$FLAVOR" \
            -t "lib/main_${FLAVOR}.dart"

      - name: Secure cleanup — remove keystore and key.properties
        if: always()
        run: |
          rm -f android/upload-keystore.jks android/key.properties

      - name: Record build provenance
        run: |
          FLAVOR="${{ inputs.flavor }}"
          SOURCE_SHA=$(git rev-parse HEAD)
          AAB_PATH="build/app/outputs/bundle/${FLAVOR}Release/app-${FLAVOR}-release.aab"
          AAB_SHA256=$(sha256sum "$AAB_PATH" | cut -d' ' -f1)
          AAB_SIZE=$(stat -c%s "$AAB_PATH")
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "AAB_SHA256=$AAB_SHA256" >> "$GITHUB_STEP_SUMMARY"
          echo "AAB_SIZE_BYTES=$AAB_SIZE" >> "$GITHUB_STEP_SUMMARY"
          echo "FLAVOR=$FLAVOR" >> "$GITHUB_STEP_SUMMARY"
          echo "BUILD_REF=${{ inputs.ref || github.ref }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release AAB (${{ inputs.flavor }})
        uses: actions/upload-artifact@v4
        with:
          name: ive-${{ inputs.flavor }}-release-aab-${{ github.run_number }}
          path: build/app/outputs/bundle/${{ inputs.flavor }}Release/app-${{ inputs.flavor }}-release.aab
          retention-days: 30
          if-no-files-found: error
