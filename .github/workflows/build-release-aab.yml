name: Build Release AAB

# IV-CORE-MOBILE-COMMERCIAL-01 — secure release bundle build.
#
# Produces a signed Android App Bundle (AAB) for a product flavor.
# The keystore is stored exclusively in GitHub Secrets — never committed.
#
# PREREQUISITE (BLOCKED_OWNER — must be done by Owner before first use):
#   1. Generate upload keystore locally (see android/key.properties.template).
#   2. Store in repository GitHub Secrets (Settings → Secrets → Actions):
#        KEYSTORE_BASE64         — base64 of upload-keystore.jks
#        KEYSTORE_STORE_PASSWORD — store password
#        KEYSTORE_KEY_ALIAS      — alias (e.g. "upload")
#        KEYSTORE_KEY_PASSWORD   — key password
#        GOOGLE_CLIENT_ID        — Android Web OAuth 2.0 client ID
#                                  (format: <digits>.apps.googleusercontent.com)
#
# SECURITY: KEYSTORE_* secrets previously populated from the now-disabled
# generate-keystore.yml (PLAY-READINESS-18 incident) MUST be rotated by
# the Owner before this workflow is used.
#
# Security fixes applied (Codex R2/R3):
#   P1-C02-A / P1-C03-A: release builds restricted to main or vX.Y.Z tags.
#     A hard ref-guard step at job start rejects any other dispatching ref
#     before any secret is exposed.
#     Additionally, the job uses `environment: release-signing` — configure
#     this environment in GitHub (Settings → Environments → release-signing)
#     with required reviewers and branch protection (main only) for defense-
#     in-depth.
#   P1-C02-B: All secrets are passed through step `env:` variables and written
#     to files via printf/Python, never interpolated directly into shell bodies.
#   P2-C02-C: GOOGLE_CLIENT_ID must match *.apps.googleusercontent.com format.

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: 'Product flavor to build'
        required: true
        default: 'core'
        type: choice
        options:
          - core
          - impact
          - quant

# Only allow one release build at a time; cancel any in-progress run.
concurrency:
  group: release-aab-${{ inputs.flavor }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build release AAB (${{ inputs.flavor }})
    runs-on: ubuntu-latest
    # P1-C03-A fix (defense-in-depth): GitHub protected environment.
    # Configure in Settings → Environments → release-signing:
    #   - Required reviewers: Owner
    #   - Deployment branches: main only
    # When configured, GitHub will require manual approval AND enforce branch
    # restrictions BEFORE this job starts (before any secret is available).
    # The ref-guard step below adds a second enforcement layer in case the
    # environment has not yet been fully configured.
    environment: release-signing

    steps:
      # P1-C03-A fix: hard ref guard — reject any dispatching ref that is
      # not main or a vX.Y.Z semantic release tag. Runs BEFORE any secret is
      # consumed, so a branch with modified build scripts cannot exfiltrate
      # signing material even if the protected environment is misconfigured.
      - name: Enforce protected release ref
        run: |
          REF="${{ github.ref }}"
          if [ "$REF" = "refs/heads/main" ]; then
            echo "Release ref check: OK (main)"
          elif echo "$REF" | grep -qE '^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Release ref check: OK (release tag $REF)"
          else
            echo "::error::RELEASE BLOCKED: dispatch from untrusted ref '$REF'."
            echo "::error::Only refs/heads/main and refs/tags/vX.Y.Z are allowed."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # P1-C01-B + P2-C02-C fix: validate GOOGLE_CLIENT_ID before any build
      # work. Fails if absent, placeholder, or wrong format.
      - name: Validate release configuration (GOOGLE_CLIENT_ID)
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          if [ -z "$GOOGLE_CLIENT_ID" ]; then
            echo "::error::RELEASE BLOCKED: GOOGLE_CLIENT_ID secret is missing."
            exit 1
          fi
          if [ "$GOOGLE_CLIENT_ID" = "placeholder.apps.googleusercontent.com" ]; then
            echo "::error::RELEASE BLOCKED: GOOGLE_CLIENT_ID is still the placeholder value."
            exit 1
          fi
          # P2-C02-C: validate format — must end with .apps.googleusercontent.com
          if ! echo "$GOOGLE_CLIENT_ID" | grep -qE '^[0-9]+-[a-z0-9]+\.apps\.googleusercontent\.com$'; then
            echo "::error::RELEASE BLOCKED: GOOGLE_CLIENT_ID does not match expected format."
            echo "::error::Expected format: <numeric_project_id>-<client_hash>.apps.googleusercontent.com"
            exit 1
          fi
          echo "GOOGLE_CLIENT_ID validation: OK"

      # P1-C01-A fix: flutter_env.cfg is an ASSET FILE loaded at runtime by
      # flutter_dotenv. Do NOT pass via --dart-define-from-file (JSON-only).
      # P1-C02-B fix: GOOGLE_CLIENT_ID written via env var, not direct interpolation.
      - name: Create flutter_env.cfg (runtime asset)
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          printf 'SUPABASE_URL=https://nzngvbajrnruknpzzjbf.supabase.co\n' > flutter_env.cfg
          printf 'SUPABASE_ANON_KEY=sb_publishable_fZboVtE9PeokahlYmhc_vg_t6JHOmFh\n' >> flutter_env.cfg
          printf 'GOOGLE_CLIENT_ID=%s\n' "$GOOGLE_CLIENT_ID" >> flutter_env.cfg

      # P1-C02-B fix: decode keystore from env var (not direct interpolation).
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          # Validate that the decoded file is a valid JKS/PKCS12 keystore.
          if ! file android/upload-keystore.jks | grep -qE 'Java KeyStore|PKCS'; then
            echo "::warning::Decoded keystore may not be a valid JKS file — verify KEYSTORE_BASE64 secret."
          fi

      # P1-C02-B fix: key.properties written via Python with env vars,
      # never via shell heredoc with direct secret interpolation.
      - name: Create key.properties
        env:
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
        run: |
          python3 - <<'PYEOF'
          import os
          lines = [
              f"storePassword={os.environ['KEYSTORE_STORE_PASSWORD']}",
              f"keyPassword={os.environ['KEYSTORE_KEY_PASSWORD']}",
              f"keyAlias={os.environ['KEYSTORE_KEY_ALIAS']}",
              "storeFile=../upload-keystore.jks",
          ]
          with open("android/key.properties", "w") as f:
              f.write("\n".join(lines) + "\n")
          PYEOF

      - name: flutter pub get
        run: flutter pub get

      # P1-C01-A fix: no --dart-define-from-file; flutter_env.cfg is an
      # asset bundled into the AAB, read at runtime via flutter_dotenv.
      - name: Build release AAB (${{ inputs.flavor }})
        run: |
          FLAVOR="${{ inputs.flavor }}"
          flutter build appbundle --release \
            --flavor "$FLAVOR" \
            -t "lib/main_${FLAVOR}.dart"

      - name: Secure cleanup — remove keystore and key.properties
        if: always()
        run: |
          rm -f android/upload-keystore.jks android/key.properties

      - name: Record build provenance
        run: |
          FLAVOR="${{ inputs.flavor }}"
          SOURCE_SHA=$(git rev-parse HEAD)
          AAB_PATH="build/app/outputs/bundle/${FLAVOR}Release/app-${FLAVOR}-release.aab"
          AAB_SHA256=$(sha256sum "$AAB_PATH" | cut -d' ' -f1)
          AAB_SIZE=$(stat -c%s "$AAB_PATH")
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "AAB_SHA256=$AAB_SHA256" >> "$GITHUB_STEP_SUMMARY"
          echo "AAB_SIZE_BYTES=$AAB_SIZE" >> "$GITHUB_STEP_SUMMARY"
          echo "FLAVOR=$FLAVOR" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release AAB (${{ inputs.flavor }})
        uses: actions/upload-artifact@v4
        with:
          name: ive-${{ inputs.flavor }}-release-aab-${{ github.run_number }}
          path: build/app/outputs/bundle/${{ inputs.flavor }}Release/app-${{ inputs.flavor }}-release.aab
          retention-days: 30
          if-no-files-found: error
