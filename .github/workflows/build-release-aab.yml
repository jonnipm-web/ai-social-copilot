name: Build Release AAB (SUPERSEDED — use release-ecosystem-coordinated.yml)

# IV-MOBILE-ECOSYSTEM-RELEASE-CLOSURE-01 / Codex R5 P1 — DISABLED.
#
# This single-flavor signing workflow was superseded by
# release-ecosystem-coordinated.yml, which validates all signing secrets
# and builds all three product flavor AABs in a single approved run.
#
# Codex R5 P1 finding: having two separate signing paths (this workflow and
# the coordinated workflow) creates an operational bypass — an operator could
# use this workflow to build a signed AAB for one flavor without the all-flavor
# keystore validation enforced by the coordinated workflow.
#
# The trigger is intentionally limited to a disabled_notice input so this
# workflow can never produce artifacts accidentally. It remains in the
# repository for historical/audit reference (security audit trail: Codex
# R1–R10 hardening applied here, then superseded by the coordinated workflow).
#
# CANONICAL RELEASE PATH: .github/workflows/release-ecosystem-coordinated.yml
# DEBUG BUILDS: .github/workflows/flutter-validation.yml (builds debug APKs)
#
# Security history (Codex R1–R10 applied before disabling):
#   R1: P1-C01-A+B, P1-C02-A+B, P1-C03-A — correctness + security baseline
#   R2: P1-C04-B, P2-C05-C — Flutter integrity verification
#   R3: P1-C05-A — ref guard before secret exposure
#   R4-R9: P1-C06-B, P1-C07-A+B, P2-C07-C, P2-C10-B — flavor validation,
#          SHA pinning, signing material timing, runner pinning
#   R10: upload-artifact@ea165f8d (v4.6.2) — corrected from wrong a8a3f3ad
#   Codex R5 P1: workflow disabled — single coordinated workflow is now
#                the only authorised path for signed release builds.

# No trigger configured — this workflow is disabled (superseded by
# release-ecosystem-coordinated.yml). The file is retained for audit trail only.
# Codex R16 P2: removing workflow_dispatch prevents it from appearing in the
# GitHub Actions UI and being confused for an executable release path.

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to run
        run: |
          echo "This workflow is permanently superseded (Codex R5 P1)."
          echo "Use .github/workflows/release-ecosystem-coordinated.yml for signed releases."
          echo "Use .github/workflows/flutter-validation.yml for debug builds."
          exit 1
