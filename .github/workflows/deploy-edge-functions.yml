name: Deploy Edge Functions (controlled, single-function)

# IVE-X4R-DG1. Replaces the prior automatic bulk-deploy behavior, which
# triggered on every push to main touching supabase/functions/** and
# looped over every directory with an unconditional --no-verify-jwt --
# that would have redeployed ive-agent-runner (frozen since X4A) and
# silently flipped context-copilot from verify_jwt=true to false on any
# such push, including the merge of a security branch. See
# docs/ive/X4R_DEPLOYMENT_PLAN.md and the IVE-X4R-DG1 report for the
# full history.
#
# MERGE != DEPLOY. This workflow has NO push trigger at all -- merging
# any branch to main, including one that changes supabase/functions/**,
# deploys nothing by itself. Every deploy is a deliberate, manual
# workflow_dispatch naming exactly one function.
#
# DEPLOY ONE FUNCTION != DEPLOY ALL FUNCTIONS. There is no loop over
# supabase/functions/*, no wildcard, no "deploy everything" path. Each
# run deploys exactly the single function named in the `function` input,
# validated against the repo-controlled allowlist at
# .github/deploy-allowlist.tsv (see that file for the JWT-policy
# rationale). scripts/ci/resolve_deploy_selection.sh implements the
# selection/validation logic and is the same script
# .github/workflows/deploy-selftest.yml uses to prove this behavior on
# every push, without ever calling `supabase` or touching production.
#
# IV-SECURITY-REMEDIATION-03: this job also runs
# scripts/ci/check_deploy_governance.sh before resolving/deploying
# anything. Before this, the repo-wide static invariants it enforces
# (no-verify-jwt exception list, allowlist/config.toml consistency, the
# ive-agent-runner/context-copilot/wildcard checks) were only ever
# exercised by deploy-selftest.yml, a separate, non-blocking workflow --
# a Codex adversarial review correctly noted this meant a real
# deploy could proceed even while that static gate was failing.
# resolve_deploy_selection.sh's own checks (allowlist membership, the
# ive-agent-runner hard block, name-format validation) were always
# enforced at deploy time regardless; this closes the remaining gap.
#
# KNOWN OUT-OF-SCOPE FINDING (not fixed by this mission, tracked
# separately): a Codex adversarial review also found that
# `${{ inputs.function }}` / `${{ needs.resolve.outputs.function }}` are
# interpolated directly into these run: blocks' shell text rather than
# passed through an env var, which is a known GitHub Actions injection
# class if the input contains shell metacharacters (e.g. a single
# quote). Exploiting it requires an actor who can already trigger
# workflow_dispatch on this repo (i.e., existing write access, who could
# achieve the same SUPABASE_ACCESS_TOKEN exposure more directly by
# editing this file in a commit) -- this bounds but does not eliminate
# the risk. Predates this mission and both files this mission actually
# changes; fixing it here would exceed IV-SECURITY-REMEDIATION-03's
# scope (SR-04/SR-05 closure + the stripe-webhook governance defect).
# Needs its own mission.

on:
  workflow_dispatch:
    inputs:
      function:
        description: 'Exact function name to deploy (must be on .github/deploy-allowlist.tsv)'
        required: true
        type: string
      confirm:
        description: 'Type DEPLOY to confirm'
        required: true
        type: string

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      function: ${{ steps.resolve.outputs.function }}
    steps:
      - uses: actions/checkout@v4

      - name: Require explicit confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "DEPLOY" ]; then
            echo "Confirmation failed. Set confirm=DEPLOY to proceed." >&2
            exit 1
          fi

      - name: Repo-wide deploy governance gate (DG2) -- must pass before any resolution/deploy
        run: |
          bash scripts/ci/check_deploy_governance.sh

      - name: Resolve and validate function selection (no production access)
        id: resolve
        run: |
          set -euo pipefail
          echo "Requested function: '${{ inputs.function }}'"
          ARGS="$(bash scripts/ci/resolve_deploy_selection.sh '${{ inputs.function }}')"
          echo "Resolved argv (one per line):"
          echo "$ARGS"
          echo "function=${{ inputs.function }}" >> "$GITHUB_OUTPUT"
          {
            echo "## Deploy resolution"
            echo "Requested: \`${{ inputs.function }}\`"
            echo '```'
            echo "supabase $ARGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy exactly one function (re-resolved, never trusts the prior job's output alone)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t ARGS < <(bash scripts/ci/resolve_deploy_selection.sh '${{ needs.resolve.outputs.function }}')
          echo "→ Running: supabase ${ARGS[*]}"
          supabase "${ARGS[@]}"
