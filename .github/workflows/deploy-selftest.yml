name: Deploy selection self-test (no production access)

# IVE-X4R-DG1/DG2. Proves scripts/ci/resolve_deploy_selection.sh -- the
# same script .github/workflows/deploy-edge-functions.yml uses to decide
# what to deploy -- behaves correctly, on every push that touches the
# deploy-governance files. Never calls `supabase`, never uses
# SUPABASE_ACCESS_TOKEN/SUPABASE_PROJECT_REF, never touches production.
# A failure here means the deploy workflow's selection logic itself is
# broken -- catch that before it ever reaches a real deploy.
#
# DG2 adds: a repo-wide static governance gate
# (scripts/ci/check_deploy_governance.sh) that fails if any workflow
# reintroduces a second real deploy route, --no-verify-jwt on
# context-copilot, ive-agent-runner deploy capability, or a bulk/
# wildcard deploy loop -- and a CRLF/LF equivalence test for the
# allowlist reader (see scripts/ci/resolve_deploy_selection.sh's own
# comment on why this matters for a Windows checkout).

on:
  push:
    paths:
      - 'scripts/ci/resolve_deploy_selection.sh'
      - 'scripts/ci/check_deploy_governance.sh'
      - '.github/deploy-allowlist.tsv'
      - '.github/workflows/deploy-selftest.yml'
      - '.github/workflows/deploy-edge-functions.yml'
      - '.github/workflows/test-context-copilot.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Safety check -- this job must never see production secrets
        run: |
          if env | grep -iE "SUPABASE_ACCESS_TOKEN|SUPABASE_PROJECT_REF|SERVICE_ROLE_KEY"; then
            echo "REFUSING: a production-shaped secret is present in this job's environment" >&2
            exit 1
          fi
          echo "OK: no production-shaped secret present."

      - name: analyze-website resolves to analyze-website ONLY, with --no-verify-jwt
        run: |
          set -euo pipefail
          OUT="$(bash scripts/ci/resolve_deploy_selection.sh analyze-website)"
          echo "$OUT"
          [ "$OUT" = "$(printf 'functions\ndeploy\nanalyze-website\n--no-verify-jwt\n--project-ref\nnzngvbajrnruknpzzjbf')" ] \
            || { echo "FAIL: unexpected resolution for analyze-website" >&2; exit 1; }
          echo "$OUT" | grep -qx "extract-knowledge" && { echo "FAIL: leaked extract-knowledge" >&2; exit 1; } || true
          echo "$OUT" | grep -qx "context-copilot" && { echo "FAIL: leaked context-copilot" >&2; exit 1; } || true
          echo "$OUT" | grep -qx "ive-agent-runner" && { echo "FAIL: leaked ive-agent-runner" >&2; exit 1; } || true
          echo "PASS: analyze-website resolves to exactly one function, JWT-preserving flag present"

      - name: extract-knowledge resolves to extract-knowledge ONLY, with --no-verify-jwt
        run: |
          set -euo pipefail
          OUT="$(bash scripts/ci/resolve_deploy_selection.sh extract-knowledge)"
          echo "$OUT"
          [ "$OUT" = "$(printf 'functions\ndeploy\nextract-knowledge\n--no-verify-jwt\n--project-ref\nnzngvbajrnruknpzzjbf')" ] \
            || { echo "FAIL: unexpected resolution for extract-knowledge" >&2; exit 1; }
          echo "PASS: extract-knowledge resolves to exactly one function, JWT-preserving flag present"

      - name: context-copilot resolves WITHOUT --no-verify-jwt (JWT policy preserved)
        run: |
          set -euo pipefail
          OUT="$(bash scripts/ci/resolve_deploy_selection.sh context-copilot)"
          echo "$OUT"
          [ "$OUT" = "$(printf 'functions\ndeploy\ncontext-copilot\n--project-ref\nnzngvbajrnruknpzzjbf')" ] \
            || { echo "FAIL: context-copilot resolution changed -- JWT policy may have been silently altered" >&2; exit 1; }
          echo "$OUT" | grep -qx -- "--no-verify-jwt" && { echo "FAIL: context-copilot would deploy with --no-verify-jwt -- this must never happen" >&2; exit 1; } || true
          echo "PASS: context-copilot preserves verify_jwt=true (no --no-verify-jwt in resolved command)"

      - name: ive-agent-runner is DENIED, non-zero exit
        run: |
          set -euo pipefail
          if bash scripts/ci/resolve_deploy_selection.sh ive-agent-runner; then
            echo "FAIL: ive-agent-runner was NOT denied" >&2
            exit 1
          fi
          echo "PASS: ive-agent-runner denied (exit non-zero, as required)"

      - name: unknown function name is DENIED, non-zero exit
        run: |
          set -euo pipefail
          if bash scripts/ci/resolve_deploy_selection.sh totally-made-up-function; then
            echo "FAIL: unknown function was NOT denied" >&2
            exit 1
          fi
          echo "PASS: unknown function denied"

      - name: wildcard/bulk/path-traversal-shaped input is DENIED, non-zero exit
        run: |
          set -euo pipefail
          for bad in '*' 'all' 'supabase/functions/*' '' 'analyze-website; rm -rf /' '--no-verify-jwt' \
                     '../../etc/passwd' 'analyze-website/../ive-agent-runner' '..' './analyze-website'; do
            if bash scripts/ci/resolve_deploy_selection.sh "$bad" 2>/dev/null; then
              echo "FAIL: '$bad' was NOT denied" >&2
              exit 1
            fi
          done
          echo "PASS: every wildcard/bulk/injection/path-traversal-shaped input denied"

      - name: process-file is DENIED (excluded pending dedicated large-asset handling)
        run: |
          set -euo pipefail
          if bash scripts/ci/resolve_deploy_selection.sh process-file; then
            echo "FAIL: process-file was NOT denied" >&2
            exit 1
          fi
          echo "PASS: process-file denied"

      - name: CRLF and LF allowlist input resolve identically (DG2)
        run: |
          set -euo pipefail
          for MODE in lf crlf; do
            FIXTURE="$(mktemp -d)"
            mkdir -p "$FIXTURE/.github" "$FIXTURE/scripts/ci"
            cp .github/deploy-allowlist.tsv "$FIXTURE/.github/deploy-allowlist.tsv"
            if [ "$MODE" = "crlf" ]; then
              sed -i 's/$/\r/' "$FIXTURE/.github/deploy-allowlist.tsv"
            fi
            cp scripts/ci/resolve_deploy_selection.sh "$FIXTURE/scripts/ci/"
            for fn in context-copilot analyze-website extract-knowledge; do
              OUT="$(bash "$FIXTURE/scripts/ci/resolve_deploy_selection.sh" "$fn")"
              eval "OUT_${MODE}_${fn//-/_}=\$OUT"
            done
            rm -rf "$FIXTURE"
          done
          for fn in context-copilot analyze-website extract-knowledge; do
            key="${fn//-/_}"
            lf_var="OUT_lf_${key}"
            crlf_var="OUT_crlf_${key}"
            if [ "${!lf_var}" != "${!crlf_var}" ]; then
              echo "FAIL: $fn resolves differently under LF vs CRLF allowlist input" >&2
              echo "--- LF ---"; echo "${!lf_var}"
              echo "--- CRLF ---"; echo "${!crlf_var}"
              exit 1
            fi
          done
          echo "PASS: LF and CRLF allowlist input resolve identically for context-copilot, analyze-website, extract-knowledge"

      - name: Repo-wide deploy governance gate (DG2)
        run: |
          bash scripts/ci/check_deploy_governance.sh
