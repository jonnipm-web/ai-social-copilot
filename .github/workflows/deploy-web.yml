name: Deploy Web → GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Flutter (versao estavel mais recente)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Criar arquivo .env com as credenciais
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> .env

      - name: Adicionar suporte à plataforma Web
        run: flutter create --platforms web --project-name ai_social_copilot .

      - name: Injetar restauração de rota SPA em web/index.html (IVE-COMMERCIAL-TARGETED-REMEDIATION-06)
        # web/index.html é gerado do zero pelo `flutter create` acima a cada
        # execução -- não existe no repositório para editar diretamente.
        # web/404.html (esse sim versionado) já faz metade do trabalho
        # (https://github.com/rafgraph/spa-github-pages); esta metade
        # restaura a URL real via history.replaceState ANTES do router do
        # Flutter inicializar, então precisa ser o primeiro <script> depois
        # de <head>, não importa a versão exata do template que o
        # `flutter create` acima gerou.
        #
        # IVE-COMMERCIAL-TARGETED-REMEDIATION-06 -- a versão anterior
        # (Remediation 04) restaurava o caminho decodificado em
        # `window.location.pathname`, que é o comportamento certo para um
        # GoRouter configurado com usePathUrlStrategy(). Este app usa a
        # estratégia hash PADRÃO (nenhum usePathUrlStrategy() em
        # lib/main.dart -- por decisão explícita de produto, GoRouter só lê
        # `window.location.hash` para decidir a rota inicial. Escrever o
        # caminho recuperado na pathname faz o Flutter nunca vê-lo: o hash
        # continua vazio, o GoRouter assume "/" e o link direto se perde
        # silenciosamente (reproduzido: um link "limpo" para /account virava
        # .../account#/login, nunca chegando na tela de Conta). A correção é
        # escrever o caminho recuperado no HASH, não na pathname.
        #
        # IVE-COMMERCIAL-TARGETED-REMEDIATION-06 (Codex adversarial review,
        # 2nd pass) -- web/404.html forwards window.location.hash verbatim,
        # unencoded, appended after everything else -- so a request that
        # (unusually) already carried its own fragment arrives here with a
        # non-empty l.hash. The first cut of this fix appended it raw after
        # the restored hash (`'#' + decoded + l.hash`), which produces a
        # second literal "#" in the URL -- syntactically present, but
        # GoRouter's hash strategy only recognizes the FIRST "#" as the
        # boundary, so everything from the second "#" onward (including
        # its own "#") becomes part of the route string GoRouter tries to
        # match, which would fail to resolve rather than cleanly ignoring
        # it. Folded into a query parameter on the restored route instead:
        # exactly one "#", route matching for `decoded` is unaffected, nothing
        # is silently dropped. Still guards only an unusual/malformed input
        # -- no real link in this app produces a clean path with its own
        # separate fragment (hash IS the route here).
        run: |
          python3 - <<'PYEOF'
          import re
          path = "web/index.html"
          with open(path, "r", encoding="utf-8") as f:
              html = f.read()
          snippet = """  <script>
            // Single Page Apps for GitHub Pages -- restaura a rota real
            // codificada por web/404.html antes do GoRouter inicializar.
            // Escreve no HASH (não na pathname): este app usa a estratégia
            // de URL hash padrão do Flutter/GoRouter (sem
            // usePathUrlStrategy()), que só lê window.location.hash.
            (function(l) {
              if (l.search[1] === '/') {
                var decoded = l.search.slice(1).split('&').map(function(s) {
                  return s.replace(/~and~/g, '&');
                }).join('?');
                // l.hash aqui só é não-vazio se a URL original (rara e
                // improvável, mas possível) já tinha seu próprio fragmento.
                // Dobrado como parâmetro de query em vez de concatenado
                // como um segundo "#" -- GoRouter só reconhece o PRIMEIRO
                // "#" como fronteira da rota; um segundo "#" quebraria o
                // casamento da rota em vez de ser ignorado.
                var extraHash = l.hash ? l.hash.slice(1) : '';
                var origHashParam = extraHash
                    ? (decoded.indexOf('?') === -1 ? '?' : '&') +
                      'orig_hash=' + encodeURIComponent(extraHash)
                    : '';
                window.history.replaceState(null, null,
                    l.pathname + '#' + decoded + origHashParam
                );
              }
            }(window.location));
          </script>
          """
          if "history.replaceState" not in html:
              html = re.sub(r"(<head>\s*)", r"\1\n" + snippet, html, count=1)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(html)
          PYEOF
          grep -q "history.replaceState" web/index.html && echo "OK: script injetado" || (echo "FALHA: script não encontrado em web/index.html" && exit 1)

      - name: Verificar restauração de rota SPA (regressão IVE-COMMERCIAL-TARGETED-REMEDIATION-06)
        # Executa o script injetado acima num DOM falso e confirma que ele
        # restaura a rota no HASH, não na pathname -- exatamente a
        # regressão que sobreviveu sem detecção da Remediation 04 até o
        # Physical E2E Gate 05 pegá-la em produção.
        run: node scripts/ci/verify_spa_hash_restore.mjs web/index.html

      - name: Instalar dependências
        run: flutter pub get

      - name: Build da versão Web
        # IVE-COMMERCIAL-STABILITY-09O — --source-maps produces main.dart.js.map
        # alongside main.dart.js; --dart-define=BUILD_SHA bakes the exact commit
        # being built into the app itself (lib/core/diagnostics/build_info.dart)
        # so a future diagnostic event can never claim a build it wasn't
        # actually compiled from. Neither flag changes runtime behavior.
        run: flutter build web --release --base-href /ai-social-copilot/ --source-maps --dart-define=BUILD_SHA=${{ github.sha }}

      - name: STABILITY-09O — instalar ferramentas de symbolication
        run: cd tool/stability09o && npm install

      - name: STABILITY-09O — validar que o source map corresponde exatamente a este build
        # Mission section 09: "If the mapping check fails: deployment should
        # not claim forensic readiness." Implemented as a hard gate — a
        # non-zero exit here fails the whole job, before anything is
        # published, rather than silently shipping an unverified map.
        #
        # Codex Gate (P1 ACCEPTED, 2nd pass) — the first version of this
        # check only proved the map was internally self-consistent, which a
        # STALE map (e.g. a cache-reuse bug) would also pass. Now passes the
        # REAL checked-out lib/main.dart from THIS SAME checkout/job so the
        # script can require exact content equality, not just internal
        # consistency — see verify_build_sourcemap.mjs's own header comment.
        run: node tool/stability09o/verify_build_sourcemap.mjs build/web/main.dart.js.map lib/main.dart

      - name: STABILITY-09O — separar source map do output público do GitHub Pages
        # Mission section 08: the map must never be copied into the public
        # GitHub Pages output. Moved OUT of build/web (not copied) before the
        # publish step below ever runs, so publish_dir structurally cannot
        # contain it. The `//# sourceMappingURL=main.dart.js.map` comment
        # dart2js left inside main.dart.js now points at a path that 404s on
        # the public site — harmless (a normal devtools 404, no information
        # disclosed).
        run: |
          mkdir -p sourcemap-artifact
          find build/web -name '*.js.map' -exec mv {} sourcemap-artifact/ \;
          echo "Arquivos movidos para fora do output público do GitHub Pages:"
          ls -la sourcemap-artifact/

      - name: STABILITY-09O — cifrar o source map antes de qualquer upload
        # Codex Gate (P1 ACCEPTED) — this repository is PUBLIC
        # (visibility: PUBLIC, confirmed via `gh repo view`). A plain
        # actions/upload-artifact upload is downloadable by ANY GitHub
        # account, not just repo collaborators (GitHub's own docs: workflow
        # artifacts follow repository READ access, and public repos grant
        # read to everyone) — that would directly violate mission section
        # 08's "artifact NOT publicly addressable" requirement, no matter
        # how the artifact is named or where it's stored on GitHub's side.
        # Encrypting the map with a symmetric key known only to this repo's
        # secrets (never itself uploaded, never logged) means the uploaded
        # BLOB can be downloaded by anyone but is useless without that key —
        # achieving the mission's actual confidentiality intent without a
        # new architectural dependency (no new cloud storage, no new
        # cross-repo credential). Fails the job outright (not silently
        # skips) if the key isn't configured — see this mission's own
        # report for the exact `gh secret set` step Paulo still needs to run
        # once before this step can succeed.
        run: |
          if [ -z "${{ secrets.SOURCEMAP_ENCRYPTION_KEY }}" ]; then
            echo "SOURCEMAP_ENCRYPTION_KEY não está configurado como secret do repositório." >&2
            echo "Sem essa chave, o artefato do source map ficaria legível por qualquer conta do GitHub (repositório público) — encerrando antes de publicar." >&2
            exit 1
          fi
          tar -C sourcemap-artifact -czf sourcemap.tar.gz .
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in sourcemap.tar.gz \
            -out sourcemap.tar.gz.enc \
            -k "${{ secrets.SOURCEMAP_ENCRYPTION_KEY }}"
          rm -f sourcemap.tar.gz
          rm -rf sourcemap-artifact
          echo "Source map cifrado — texto plano removido do workspace do runner."

      - name: STABILITY-09O — publicar source map cifrado como artefato do Actions (retenção 90 dias)
        uses: actions/upload-artifact@v4
        with:
          name: sourcemap-${{ github.sha }}
          path: sourcemap.tar.gz.enc
          retention-days: 90

      - name: Publicar no GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
