name: Edge Function Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:

jobs:
  deno-test:
    name: context-copilot unit tests (Deno)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run context-copilot tests
        env:
          DENO_TESTING: "1"
          GROQ_API_KEY: "test-key-ci"
        run: |
          deno test \
            --allow-env \
            --allow-net=deno.land \
            supabase/functions/context-copilot/index_test.ts
