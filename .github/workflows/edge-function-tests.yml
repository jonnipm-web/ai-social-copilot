name: Edge Function Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'contracts/aef/**'
      - 'aef/**'
  workflow_dispatch:

jobs:
  deno-test:
    name: context-copilot unit tests (Deno)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run context-copilot tests
        env:
          DENO_TESTING: "1"
          GROQ_API_KEY: "test-key-ci"
        run: |
          deno test \
            --allow-env \
            --allow-net=deno.land \
            supabase/functions/context-copilot/index_test.ts

      - name: Run quota helper tests (IVE-COMMERCIAL-QUOTA-HARDENING-13)
        run: |
          deno test \
            --allow-env \
            --allow-net=deno.land,esm.sh \
            supabase/functions/_shared/quota_test.ts

  entitlement-core-ci:
    name: Server-side entitlement + Promotion Gate (MODULE-FOUNDATION-AND-ENTITLEMENT-02)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check entitlement authority, module policy and every Edge Function
        run: |
          deno check supabase/functions/_shared/entitlement.ts supabase/functions/_shared/module_policy.ts             supabase/functions/*/index.ts

      - name: Lint entitlement core
        run: |
          deno lint supabase/functions/_shared/entitlement.ts supabase/functions/_shared/entitlement_test.ts             supabase/functions/_shared/entitlement_test_support.ts supabase/functions/_shared/entitlement_vectors_test.ts             supabase/functions/_shared/module_policy.ts supabase/functions/_shared/module_policy_test.ts             supabase/functions/_shared/module_gate_handlers_test.ts supabase/functions/module-access/

      - name: Entitlement authority, shared decision vectors, Promotion Gate invariants, executed gate on all 17 module functions
        env:
          DENO_TESTING: "1"
          GROQ_API_KEY: "test-key-ci"
        run: |
          deno test --allow-env --allow-read --allow-net=deno.land,esm.sh             supabase/functions/_shared/entitlement_test.ts             supabase/functions/_shared/entitlement_vectors_test.ts             supabase/functions/_shared/module_policy_test.ts             supabase/functions/_shared/module_gate_handlers_test.ts             supabase/functions/module-access/index_test.ts

  contract-and-aef-ci:
    name: AEF contract + kernel CI (IV-AEF-FOUNDATION-01)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check contracts/aef and aef/
        run: |
          deno check contracts/aef/*.ts contracts/aef/schema_parity_test.ts \
            aef/*.ts aef/adapters/*.ts

      - name: Lint contracts/aef and aef/
        run: |
          deno lint contracts/aef/*.ts contracts/aef/schema_parity_test.ts \
            aef/*.ts aef/adapters/*.ts

      - name: Run contract validator tests (65 cases)
        run: |
          deno test --allow-read contracts/aef/validators_test.ts

      - name: Run schema-parity tests (10 cases, Codex Finding N-03)
        run: |
          deno test --allow-read --allow-net=registry.npmjs.org contracts/aef/schema_parity_test.ts

      - name: Run AEF v0 kernel tests (security matrix + confused deputy + concurrency)
        run: |
          deno test --allow-read --allow-net=deno.land,esm.sh \
            aef/kernel_test.ts aef/adapters/supabase_identity_resolver_test.ts
