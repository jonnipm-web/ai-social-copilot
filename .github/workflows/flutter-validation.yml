name: Flutter Validation — Analyze + Test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: flutter analyze + flutter test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create .env (placeholder para asset loader)
        run: |
          echo "SUPABASE_URL=https://placeholder.supabase.co" > .env
          echo "SUPABASE_ANON_KEY=placeholder_anon_key" >> .env
          echo "GOOGLE_CLIENT_ID=placeholder.apps.googleusercontent.com" >> .env

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze --fatal-warnings --no-fatal-infos

      - name: flutter test
        run: flutter test --reporter expanded

      - name: TEMP DIAGNOSTIC — build web with source maps (IVE-COMMERCIAL-STABILITY-08 Phase 3/4, not for merge)
        run: |
          flutter create --platforms web --project-name ai_social_copilot .
          flutter build web --release --base-href /ai-social-copilot/ --source-maps

      - name: TEMP DIAGNOSTIC — upload source map bundle
        uses: actions/upload-artifact@v4
        with:
          name: sourcemap-bundle
          path: |
            build/web/main.dart.js
            build/web/main.dart.js.map
          retention-days: 1
