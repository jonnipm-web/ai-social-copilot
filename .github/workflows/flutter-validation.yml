name: Flutter Validation — Analyze + Test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: flutter analyze + flutter test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create .env (placeholder para asset loader)
        run: |
          echo "SUPABASE_URL=https://placeholder.supabase.co" > .env
          echo "SUPABASE_ANON_KEY=placeholder_anon_key" >> .env
          echo "GOOGLE_CLIENT_ID=placeholder.apps.googleusercontent.com" >> .env

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze --fatal-warnings --no-fatal-infos

      - name: flutter test
        run: flutter test --reporter expanded

      - name: TEMP DIAGNOSTIC — real (publishable-only) credentials for faithful local reproduction
        # IVE-COMMERCIAL-STABILITY-09R Section 10/12 — "faithful reproduction
        # harness" needs a REAL authenticated session (login, profile,
        # entitlement redirect, IVE context) to exercise the actual
        # candidate zones; the placeholder .env above (used only for
        # analyze/test, which never talk to a real backend) can't do that.
        # SUPABASE_ANON_KEY and GOOGLE_CLIENT_ID are the same publishable,
        # client-side-safe values already shipped inside the real deployed
        # main.dart.js (anyone can read them from production's own bundle)
        # — not secrets, safe in this private, 1-day-retention artifact.
        # This build is never deployed anywhere, only downloaded and run
        # locally for this mission's own forensic session.
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> .env

      - name: TEMP DIAGNOSTIC — build web with source maps (IVE-COMMERCIAL-STABILITY-09R, not for merge)
        run: |
          flutter create --platforms web --project-name ai_social_copilot .
          flutter build web --release --base-href /ai-social-copilot/ --source-maps

      - name: TEMP DIAGNOSTIC — upload full web build (incl. source maps)
        uses: actions/upload-artifact@v4
        with:
          name: webbuild-bundle-09r
          path: build/web
          retention-days: 1
