name: Flutter Validation — Analyze + Test

on:
  # IV-QUANT-DATA-PLANE-AND-API-02: the Quant Lab branch never merges to main
  # during the lab phase, and workflow_dispatch needs the file on the default
  # branch, so pushes to the Quant line run CI directly. Scoped to that line
  # only; deploy workflows are unaffected (none trigger on these branches).
  push:
    branches: ['claude/insightvalues-quant-**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: flutter analyze + flutter test
    # IV-MOBILE-ECOSYSTEM-RELEASE-CLOSURE-01: pin to ubuntu-22.04 for toolchain
    # stability, matching build-release-aab.yml. ubuntu-latest is mutable.
    runs-on: ubuntu-22.04

    # Least-privilege permissions. No write access needed.
    permissions:
      contents: read

    steps:
      # IV-MOBILE-ECOSYSTEM-RELEASE-CLOSURE-01: pinned to immutable commit SHA
      # (v4.2.2). Matches build-release-aab.yml. Eliminates mutable @v4 tag.
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      # IV-MOBILE-ECOSYSTEM-RELEASE-CLOSURE-01: eliminates actions/setup-java@v4
      # mutable tag (same fix applied to build-release-aab.yml). Java 17 is
      # pre-installed on ubuntu-22.04 runners; $JAVA_HOME_17_X64 is documented.
      - name: Use Java 17 (pre-installed on ubuntu-22.04)
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME_17_X64/bin/java" -version

      # IV-MOBILE-ECOSYSTEM-RELEASE-CLOSURE-01: eliminates subosito/flutter-action@v2
      # mutable third-party tag. Direct installation from Google storage, pinned
      # version, SHA-256 verified against official releases manifest — same
      # security posture as build-release-aab.yml.
      # Note: no action-level caching; Flutter precache --android --web covers
      # the tool artifacts needed by both build gates below.
      - name: Install Flutter 3.47.4 (stable, SHA-256 verified)
        run: |
          FLUTTER_VERSION="3.47.4"
          RELEASES_URL="https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json"
          ARCHIVE_URL="https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"

          EXPECTED_SHA256=$(curl -fsSL "$RELEASES_URL" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          target = '${FLUTTER_VERSION}'
          for r in data.get('releases', []):
              if r.get('version') == target and r.get('channel') == 'stable':
                  print(r.get('sha256', ''))
                  break
          ")

          if [ -z "$EXPECTED_SHA256" ]; then
            echo "::error::Flutter ${FLUTTER_VERSION} SHA-256 not in releases manifest."
            exit 1
          fi

          curl -fsSL "$ARCHIVE_URL" -o flutter.tar.xz
          ACTUAL_SHA256=$(sha256sum flutter.tar.xz | cut -d' ' -f1)

          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "::error::Flutter archive integrity check FAILED."
            echo "::error::Expected: $EXPECTED_SHA256  Actual: $ACTUAL_SHA256"
            rm -f flutter.tar.xz
            exit 1
          fi

          echo "Flutter archive integrity: OK ($ACTUAL_SHA256)"
          tar xf flutter.tar.xz
          rm flutter.tar.xz
          echo "$GITHUB_WORKSPACE/flutter/bin" >> "$GITHUB_PATH"
          flutter/bin/flutter config --no-analytics
          flutter/bin/flutter precache --android --web --no-ios

      - name: Create flutter_env.cfg (placeholder para asset loader)
        run: |
          echo "SUPABASE_URL=https://placeholder.supabase.co" > flutter_env.cfg
          echo "SUPABASE_ANON_KEY=placeholder_anon_key" >> flutter_env.cfg
          echo "GOOGLE_CLIENT_ID=placeholder.apps.googleusercontent.com" >> flutter_env.cfg

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        # R16: analyzer findings are also published as check-run annotations
        # (batched, <=9 per step) so they are readable from the PR / API
        # without downloading raw logs. Exit code is unchanged.
        run: |
          set +e
          flutter analyze --fatal-warnings --no-fatal-infos > analyze_out.txt 2>&1
          code=$?
          cat analyze_out.txt
          grep -E "^\s*(error|warning) " analyze_out.txt | sed 's/%/%25/g' > analyze_findings.txt
          split -l 25 -d analyze_findings.txt analyze_chunk_ || true
          for f in $(ls analyze_chunk_* 2>/dev/null | head -9); do
            msg=$(awk 'BEGIN{ORS="%0A"} {print}' "$f")
            echo "::error title=flutter analyze::${msg}"
          done
          exit $code

      - name: flutter test
        # R16: the github reporter emits failing tests as annotations.
        run: flutter test --reporter github

      - name: Adicionar suporte à plataforma Web
        # web/ não é versionado neste repositório (gerado por `flutter
        # create`, mesmo padrão de deploy-web.yml); sem este passo o build
        # abaixo falha com "This project is not configured for the web."
        run: flutter create --platforms web --project-name ai_social_copilot .

      - name: flutter build web (release, build gate only -- never published)
        run: flutter build web --release

      - name: flutter build apk (debug, build gate only -- never published/signed for release)
        # GOOGLE-AUTH-ANDROID-IDENTITY-GATE-17 -- android/ is now a real,
        # committed platform folder (previously regenerated via `flutter
        # create` on every local build, which is why the applicationId
        # kept silently reverting to Flutter's com.example.* placeholder).
        # Debug build only: no release keystore exists yet in CI, and none
        # should ever be added here as a plaintext secret -- see
        # android/app/build.gradle.kts's own signing-config doc comment.
        # --flavor core/impact/quant: IV-MOBILE-ECOSYSTEM-FOUNDATION-01 replaced
        # the `insightvalues` flavor with three product flavors. All three must
        # be validated in CI — flavor-specific manifest merges, resources, and
        # Dart entry points can differ between products (P2-R8-C fix).
        run: |
          flutter build apk --debug --flavor core -t lib/main_core.dart
          flutter build apk --debug --flavor impact -t lib/main_impact.dart
          flutter build apk --debug --flavor quant -t lib/main_quant.dart
