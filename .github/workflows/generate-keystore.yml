name: 🔑 Gerar Keystore (rodar apenas 1 vez)

# Execute este workflow UMA vez, copie os valores para os secrets do GitHub,
# e depois pode desativar ou deletar este arquivo.

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gerar keystore de release
        run: |
          keytool -genkey -v \
            -keystore release.jks \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass Android123! \
            -keypass Android123! \
            -dname "CN=AI Social Copilot, OU=Dev, O=Dev, L=BR, S=BR, C=BR"

          echo ""
          echo "=========================================================="
          echo "COPIE OS VALORES ABAIXO PARA OS SECRETS DO GITHUB"
          echo "Vá em: Settings → Secrets and variables → Actions → New secret"
          echo "=========================================================="
          echo ""
          echo "Secret 1 — Nome: KEYSTORE_BASE64"
          echo "Valor (copie a linha inteira abaixo):"
          base64 -w 0 release.jks
          echo ""
          echo ""
          echo "Secret 2 — Nome: KEY_ALIAS"
          echo "Valor: upload"
          echo ""
          echo "Secret 3 — Nome: KEY_STORE_PASSWORD"
          echo "Valor: Android123!"
          echo ""
          echo "Secret 4 — Nome: KEY_PASSWORD"
          echo "Valor: Android123!"
          echo ""
          echo "=========================================================="
          echo "Após adicionar os 4 secrets, execute o workflow BUILD WEEK"
          echo "=========================================================="
