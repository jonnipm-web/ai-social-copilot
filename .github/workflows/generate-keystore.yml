name: 🔑 Gerar Keystore (DESATIVADO — incidente de segurança)

# PLAY-READINESS-18 — DISABLED, DO NOT RE-ENABLE.
#
# This workflow generated a release keystore with a HARDCODED password
# committed in plaintext to this file's git history (value intentionally
# not reproduced here -- do not re-add it), and
# printed the resulting base64-encoded keystore to the CI run log. Both
# the password and any keystore material ever produced by this workflow
# must be treated as permanently compromised -- they are recoverable from
# git history and (if the workflow was ever actually run) from Actions
# logs regardless of this file's current content.
#
# If GitHub Actions secrets KEYSTORE_BASE64 / KEYSTORE_STORE_PASSWORD /
# KEYSTORE_KEY_ALIAS / KEYSTORE_KEY_PASSWORD exist in this repository's
# settings, they were very likely populated from this workflow's output
# and must be deleted/rotated by the Owner (Settings -> Secrets and
# variables -> Actions). This cannot be done from CI/from this codebase.
#
# The real release keystore must be generated interactively on the
# Owner's own machine, with a password only the Owner knows, never
# printed to any log or committed anywhere -- see the project's Owner
# Keystore Recovery Checklist / PLAY-READINESS-18 report.
#
# The trigger below is intentionally removed so this workflow can never
# run, accidentally or otherwise, while it remains in the repository for
# historical/audit reference.
on:
  workflow_dispatch:
    inputs:
      disabled_notice:
        description: "This workflow is permanently disabled -- see the comment at the top of this file."
        required: false
        default: "disabled"

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to run
        run: |
          echo "This workflow is permanently disabled due to a security incident."
          echo "See the comment block at the top of .github/workflows/generate-keystore.yml"
          exit 1
