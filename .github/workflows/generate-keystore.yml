name: 🔑 Gerar Keystore (rodar apenas 1 vez)

# Execute este workflow UMA vez para gerar o keystore de release.
# Após a execução:
#   1. Copie os valores indicados abaixo para os Secrets do GitHub
#   2. DESATIVE ou DELETE este workflow (Settings → Actions → Workflows)
# O keystore não deve ser regenerado após o primeiro release publicado.
#
# Pré-requisito: configure os seguintes Secrets ANTES de rodar:
#   KEYSTORE_PASSWORD  — senha para o keystore (crie uma senha forte)
#
# Após a execução, configure também:
#   KEYSTORE_BASE64    — valor impresso no log (keystore codificado em base64)
#   KEY_ALIAS          — "upload" (fixo)
#   KEY_STORE_PASSWORD — mesma senha configurada em KEYSTORE_PASSWORD
#   KEY_PASSWORD       — mesma senha configurada em KEYSTORE_PASSWORD

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validar que KEYSTORE_PASSWORD está configurado
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [[ -z "${KEYSTORE_PASSWORD:-}" ]]; then
            echo "ERRO: Secret KEYSTORE_PASSWORD não configurado."
            echo "Configure em: Settings → Secrets and variables → Actions → New secret"
            exit 1
          fi
          echo "KEYSTORE_PASSWORD configurado."

      - name: Gerar keystore de release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          keytool -genkey -v \
            -keystore release.jks \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass  "$KEYSTORE_PASSWORD" \
            -dname "CN=AI Social Copilot, OU=Dev, O=Dev, L=BR, S=BR, C=BR"

          echo ""
          echo "=========================================================="
          echo "COPIE OS VALORES ABAIXO PARA OS SECRETS DO GITHUB"
          echo "Vá em: Settings → Secrets and variables → Actions → New secret"
          echo "=========================================================="
          echo ""
          echo "Secret 1 — Nome: KEYSTORE_BASE64"
          echo "Valor (copie a linha inteira abaixo):"
          base64 -w 0 release.jks
          echo ""
          echo ""
          echo "Secret 2 — Nome: KEY_ALIAS"
          echo "Valor: upload"
          echo ""
          echo "Secret 3 — Nome: KEY_STORE_PASSWORD"
          echo "Valor: (mesma senha configurada em KEYSTORE_PASSWORD)"
          echo ""
          echo "Secret 4 — Nome: KEY_PASSWORD"
          echo "Valor: (mesma senha configurada em KEYSTORE_PASSWORD)"
          echo ""
          echo "=========================================================="
          echo "IMPORTANTE: Desative este workflow após copiar os valores."
          echo "Após o primeiro release, NÃO regenere o keystore."
          echo "=========================================================="
