name: IVE Avatar V2 Validation

on:
  push:
    branches:
      - claude/ive-avatar-v2-final-fix
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      expected_commit:
        description: 'Expected HEAD commit SHA (optional — for audit traceability)'
        required: false

concurrency:
  group: ive-avatar-v2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── PRIMARY VALIDATION JOB ──────────────────────────────────────────────────
  validation:
    name: IVE Avatar V2 — Format · Analyze · Test · APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # ── 1. CHECKOUT ─────────────────────────────────────────────────────────

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. COMMIT IDENTITY ──────────────────────────────────────────────────

      - name: Identify branch and commit
        run: |
          BRANCH=$(git branch --show-current)
          COMMIT=$(git rev-parse HEAD)
          echo "Branch : $BRANCH"
          echo "Commit : $COMMIT"
          echo ""
          git log -3 --oneline
          echo ""
          git status --short
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
          echo "COMMIT=$COMMIT" >> "$GITHUB_ENV"

          if [ -n "${{ inputs.expected_commit }}" ]; then
            EXPECTED="${{ inputs.expected_commit }}"
            if [[ "$COMMIT" != "$EXPECTED"* ]]; then
              echo ""
              echo "FAIL: HEAD is $COMMIT but expected $EXPECTED"
              exit 1
            fi
            echo "PASS: commit matches expected prefix $EXPECTED"
          fi

      # ── 3. TOOLCHAIN SETUP ──────────────────────────────────────────────────

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # flutter-version not pinned: no existing workflow in this project pins a
      # specific version. Pin here when a verified Flutter version is identified.
      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Log toolchain versions
        run: |
          flutter --version
          dart --version
          java -version 2>&1

      # ── 4. DEPENDENCIES ─────────────────────────────────────────────────────

      # Safe placeholders — no production secrets needed for format/analyze/test/
      # debug build. Service role keys are never written here.
      - name: Create .env with safe placeholders
        run: |
          echo "SUPABASE_URL=https://example.supabase.co"            > .env
          echo "SUPABASE_ANON_KEY=placeholder-safe-anon-key"        >> .env
          echo "GOOGLE_CLIENT_ID=placeholder.apps.googleusercontent.com" >> .env

      - name: flutter pub get
        run: flutter pub get

      - name: Verify workspace clean after pub get
        run: |
          echo "=== git status after pub get ==="
          git status --short
          DIRTY=$(git status --short | grep -v "^??" | head -5)
          if [ -n "$DIRTY" ]; then
            echo ""
            echo "FAIL: tracked files unexpectedly modified by flutter pub get:"
            echo "$DIRTY"
            exit 1
          fi
          echo "PASS: no tracked files modified"

      # ── 5. ASSET VERIFICATION ───────────────────────────────────────────────

      - name: Verify assets/ive structure
        run: |
          echo "=== git-tracked ive assets ==="
          git ls-files assets/ive
          echo ""
          echo "=== pubspec.yaml declarations ==="
          grep -n "assets/ive" pubspec.yaml
          echo ""

          if [ -f assets/ive/rive/.gitkeep ]; then
            echo "PASS: assets/ive/rive/.gitkeep present"
          else
            echo "FAIL: assets/ive/rive/.gitkeep missing"
            exit 1
          fi

          RIV_COUNT=$(find assets/ive/rive -name "*.riv" 2>/dev/null | wc -l)
          if [ "$RIV_COUNT" -eq 0 ]; then
            echo "PASS: no fake .riv files"
          else
            echo "FAIL: found $RIV_COUNT unexpected .riv file(s)"
            find assets/ive/rive -name "*.riv"
            exit 1
          fi

      # ── 6. GATE — DART FORMAT ───────────────────────────────────────────────
      # Checks only the 4 files modified in the hotfix commits.
      # On failure: fix locally with `dart format <files>` and push.
      - name: GATE — dart format (4 hotfix files)
        id: format
        run: |
          dart format --output=none --set-exit-if-changed \
            lib/app.dart \
            lib/shared/ive_avatar/animations/ive_avatar_animation_controller.dart \
            lib/shared/ive_avatar/widgets/ive_avatar_assistant_button.dart \
            lib/shared/ive_avatar/widgets/ive_avatar_v2.dart

      # ── 7. GATE — STATIC ANALYSIS ───────────────────────────────────────────

      - name: GATE — dart analyze ive_avatar module
        id: analyze_dart
        run: dart analyze lib/shared/ive_avatar test/features/ive

      - name: GATE — flutter analyze --fatal-warnings (V2 scope)
        id: analyze_flutter
        # Scoped to V2 paths only — pre-existing warnings in unrelated files
        # must not block V2 validation (fixing them would be global refactoring).
        run: flutter analyze lib/shared/ive_avatar test/features/ive lib/app.dart --fatal-warnings

      # ── 8. ISOLATION CHECKS ─────────────────────────────────────────────────

      - name: Verify isolation guarantees
        id: isolation
        run: |
          FAIL=0

          echo "=== [1] Feature flag default value ==="
          # Provider uses arrow syntax: Provider<bool>((_) => false)
          if grep -q "=> false" \
            lib/shared/ive_avatar/providers/ive_avatar_provider_v2.dart; then
            echo "PASS: iveAvatarV2 flag returns false by default"
          else
            echo "FAIL: could not confirm feature flag is false"
            FAIL=1
          fi

          echo ""
          echo "=== [2] No production screen references V2 ==="
          PROD_REFS=$(grep -rn \
            "IveAvatarV2\|ive_avatar_v2\|IveAvatarCompact\|IveAvatarCard\|IveAvatarAssistantButton" \
            lib/ \
            --include="*.dart" \
            | grep -v "lib/shared/ive_avatar/" \
            | grep -v "lib/app.dart" \
            | grep -v "lib/data/models/feature_flag.dart" \
            || true)
          if [ -z "$PROD_REFS" ]; then
            echo "PASS: no unauthorized V2 references in production code"
          else
            echo "FAIL: unexpected V2 references:"
            echo "$PROD_REFS"
            FAIL=1
          fi

          echo ""
          echo "=== [3] kDebugMode guard on showcase route ==="
          if grep -q "kDebugMode" lib/app.dart; then
            grep -n "kDebugMode" lib/app.dart
            echo "PASS: kDebugMode guard present in app.dart"
          else
            echo "FAIL: kDebugMode guard not found in app.dart"
            FAIL=1
          fi

          echo ""
          echo "=== [4] ive_overlay.dart present and uncontaminated ==="
          if [ -f lib/shared/widgets/ive_overlay.dart ]; then
            echo "PASS: ive_overlay.dart present"
          else
            echo "FAIL: ive_overlay.dart missing"
            FAIL=1
          fi
          if grep -q "IveAvatarV2\|ive_avatar_v2" \
            lib/shared/widgets/ive_overlay.dart 2>/dev/null; then
            echo "FAIL: ive_overlay.dart contains V2 references"
            FAIL=1
          else
            echo "PASS: ive_overlay.dart clean"
          fi

          echo ""
          echo "=== [5] main.dart not modified by V2 commits ==="
          git log --oneline -- lib/main.dart | head -3

          echo ""
          if [ $FAIL -eq 0 ]; then
            echo "All isolation checks passed."
          else
            echo "FAIL: one or more isolation checks failed."
            exit 1
          fi

      # ── 9. SMOKE TEST ───────────────────────────────────────────────────────

      - name: Create test-results directory
        run: mkdir -p test-results

      - name: SMOKE TEST — feature flag is false by default
        id: smoke_test
        timeout-minutes: 10
        run: |
          set -o pipefail
          flutter test \
            test/features/ive/ive_avatar_v2_test.dart \
            --no-pub \
            -j 1 \
            --reporter expanded \
            --timeout 60s \
            --name "iveAvatarV2EnabledProvider is false by default" \
            2>&1 | tee test-results/smoke-test.txt

      # ── 10. AVATAR V2 TEST SUITE ────────────────────────────────────────────

      - name: SUITE — Avatar V2
        id: v2_tests
        timeout-minutes: 15
        run: |
          set -o pipefail
          flutter test \
            test/features/ive/ive_avatar_v2_test.dart \
            --no-pub \
            -j 1 \
            --reporter expanded \
            --timeout 120s \
            2>&1 | tee test-results/ive-avatar-v2-tests.txt

      # ── 11. FULL PROJECT TEST SUITE ─────────────────────────────────────────

      - name: SUITE — Full project
        id: full_tests
        timeout-minutes: 30
        run: |
          set -o pipefail
          flutter test \
            --no-pub \
            -j 1 \
            --reporter expanded \
            --timeout 120s \
            2>&1 | tee test-results/full-suite.txt

      # ── 12. BUILD DEBUG APK ─────────────────────────────────────────────────
      # Requires a complete android/ directory committed to the repository.
      # The android/ project is not part of the V2 avatar module — if it is
      # absent or incomplete this step documents the gap and exits cleanly.
      # Do NOT run flutter create in CI to fill the gap.
      - name: Build APK debug
        id: debug_apk
        run: |
          if [ ! -f android/app/build.gradle ]; then
            echo "INFO: android/app/build.gradle not found."
            echo "INFO: The android project has not been committed."
            echo "INFO: APK build skipped — commit the full android/ directory to enable."
            echo "DEBUG_APK_SHA=N/A (android project not committed)" >> "$GITHUB_ENV"
            echo "DEBUG_APK_SIZE=N/A" >> "$GITHUB_ENV"
            exit 0
          fi
          flutter build apk --debug

      - name: Verify workspace clean after build
        if: env.DEBUG_APK_SIZE != 'N/A'
        run: |
          echo "=== git status after build ==="
          git status --short
          DIRTY=$(git status --short | grep -v "^??" | head -5)
          if [ -n "$DIRTY" ]; then
            echo ""
            echo "FAIL: tracked files unexpectedly modified during build:"
            echo "$DIRTY"
            echo "Investigate and commit these changes or add them to .gitignore."
            exit 1
          fi
          echo "PASS: no tracked files modified by build"

      - name: Verify and hash debug APK
        id: apk_hash
        if: env.DEBUG_APK_SIZE != 'N/A'
        run: |
          APK=build/app/outputs/flutter-apk/app-debug.apk
          test -f "$APK"
          ls -lh "$APK"
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          SIZE=$(du -sh "$APK" | cut -f1)
          echo "DEBUG_APK_SHA=$SHA"   >> "$GITHUB_ENV"
          echo "DEBUG_APK_SIZE=$SIZE" >> "$GITHUB_ENV"
          echo "SHA-256 : $SHA"
          echo "Size    : $SIZE"

      - name: Verify kDebugMode guard (static)
        run: |
          echo "=== kDebugMode guard in lib/app.dart ==="
          grep -B1 -A4 "kDebugMode" lib/app.dart
          echo ""
          echo "Dart semantics: kDebugMode is a compile-time const bool."
          echo "In release builds its value is false, eliminating the if block."
          echo "The GoRoute for the showcase path is never constructed in release."
          echo "Static confirmation only. Final proof requires a signed release build."

      # ── 13. UPLOAD ARTIFACTS ────────────────────────────────────────────────

      - name: Upload debug APK
        if: steps.debug_apk.outcome == 'success' && env.DEBUG_APK_SIZE != 'N/A'
        uses: actions/upload-artifact@v4
        with:
          name: ive-avatar-v2-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ive-avatar-v2-test-results
          path: test-results/
          retention-days: 7

      # ── 14. JOB SUMMARY ─────────────────────────────────────────────────────

      - name: Generate job summary
        if: always()
        run: |
          FLUTTER_VER=$(flutter --version 2>&1 | head -1 || echo "unavailable")

          icon() {
            case "$1" in
              success) printf "✅ PASS" ;;
              failure) printf "❌ FAIL" ;;
              skipped) printf "⏭ SKIPPED" ;;
              *)       printf "⚠️ %s" "$1" ;;
            esac
          }

          # Final result — derived from step exit codes only
          MANDATORY=(
            "${{ steps.format.outcome }}"
            "${{ steps.analyze_dart.outcome }}"
            "${{ steps.analyze_flutter.outcome }}"
            "${{ steps.isolation.outcome }}"
            "${{ steps.smoke_test.outcome }}"
            "${{ steps.v2_tests.outcome }}"
            "${{ steps.debug_apk.outcome }}"
          )
          RESULT="PASS"
          for o in "${MANDATORY[@]}"; do
            if [ "$o" != "success" ]; then
              RESULT="FAIL"
              break
            fi
          done
          if [ "$RESULT" = "PASS" ] && \
             [ "${{ steps.full_tests.outcome }}" != "success" ]; then
            RESULT="PASS WITH LIMITATIONS (full suite: ${{ steps.full_tests.outcome }})"
          fi

          {
            echo "## IVE Avatar V2 Validation"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **Branch** | \`${BRANCH}\` |"
            echo "| **Commit** | \`${COMMIT}\` |"
            echo "| **Flutter** | ${FLUTTER_VER} |"
            echo ""
            echo "### Gates"
            echo "| Gate | Result |"
            echo "|------|--------|"
            echo "| dart format (4 hotfix files) | $(icon '${{ steps.format.outcome }}') |"
            echo "| dart analyze ive_avatar + tests | $(icon '${{ steps.analyze_dart.outcome }}') |"
            echo "| flutter analyze --fatal-warnings (V2 scope) | $(icon '${{ steps.analyze_flutter.outcome }}') |"
            echo "| Isolation checks | $(icon '${{ steps.isolation.outcome }}') |"
            echo ""
            echo "### Tests"
            echo "| Suite | Result |"
            echo "|-------|--------|"
            echo "| Smoke — feature flag default | $(icon '${{ steps.smoke_test.outcome }}') |"
            echo "| Avatar V2 suite | $(icon '${{ steps.v2_tests.outcome }}') |"
            echo "| Full project suite | $(icon '${{ steps.full_tests.outcome }}') |"
            echo ""
            echo "### Build"
            echo "| Item | Value |"
            echo "|------|-------|"
            echo "| Debug APK | $(icon '${{ steps.debug_apk.outcome }}') |"
            echo "| SHA-256 | \`${DEBUG_APK_SHA:-N/A}\` |"
            echo "| Size | ${DEBUG_APK_SIZE:-N/A} |"
            echo ""
            echo "### Final Result"
            echo "\`\`\`"
            echo "${RESULT}"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── OPTIONAL RELEASE JOB (manual dispatch only) ─────────────────────────────
  release:
    name: IVE Avatar V2 — Release APK
    needs: validation
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check signing secrets
        id: signing_check
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ] && \
             [ -n "${{ secrets.KEY_ALIAS }}" ] && \
             [ -n "${{ secrets.KEY_PASSWORD }}" ] && \
             [ -n "${{ secrets.STORE_PASSWORD }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Signing secrets present — proceeding with signed release build."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "SKIPPED: one or more signing secrets not configured."
            echo "Set KEYSTORE_BASE64, KEY_ALIAS, KEY_PASSWORD, STORE_PASSWORD to enable."
          fi

      - name: Setup Java 17 (Temurin)
        if: steps.signing_check.outputs.available == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter (stable)
        if: steps.signing_check.outputs.available == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create .env with safe placeholders
        if: steps.signing_check.outputs.available == 'true'
        run: |
          echo "SUPABASE_URL=https://example.supabase.co"            > .env
          echo "SUPABASE_ANON_KEY=placeholder-safe-anon-key"        >> .env
          echo "GOOGLE_CLIENT_ID=placeholder.apps.googleusercontent.com" >> .env

      - name: flutter pub get
        if: steps.signing_check.outputs.available == 'true'
        run: flutter pub get

      - name: Decode release keystore
        if: steps.signing_check.outputs.available == 'true'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.keystore

      - name: Build APK release
        if: steps.signing_check.outputs.available == 'true'
        id: release_build
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build apk --release
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -f "$APK"
          ls -lh "$APK"
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          SIZE=$(du -sh "$APK" | cut -f1)
          echo "RELEASE_APK_SHA=$SHA"   >> "$GITHUB_ENV"
          echo "RELEASE_APK_SIZE=$SIZE" >> "$GITHUB_ENV"
          echo "SHA-256 : $SHA"
          echo "Size    : $SIZE"

      - name: Remove keystore
        if: always()
        run: rm -f /tmp/release.keystore

      - name: Upload release APK
        if: steps.release_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ive-avatar-v2-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

      - name: Release job summary
        if: always()
        run: |
          SIGNING="${{ steps.signing_check.outputs.available }}"
          if [ "$SIGNING" = "true" ]; then
            case "${{ steps.release_build.outcome }}" in
              success) LABEL="SIGNED RELEASE — PASS" ;;
              failure) LABEL="SIGNED RELEASE — FAIL" ;;
              *)       LABEL="SIGNED RELEASE — ${{ steps.release_build.outcome }}" ;;
            esac
          else
            LABEL="RELEASE SKIPPED (signing secrets not configured)"
          fi
          {
            echo "## IVE Avatar V2 — Release Job"
            echo ""
            echo "| Item | Result |"
            echo "|------|--------|"
            echo "| Signing secrets | ${SIGNING} |"
            echo "| Build | ${LABEL} |"
            echo "| SHA-256 | \`${RELEASE_APK_SHA:-N/A}\` |"
            echo "| Size | ${RELEASE_APK_SIZE:-N/A} |"
          } >> "$GITHUB_STEP_SUMMARY"
