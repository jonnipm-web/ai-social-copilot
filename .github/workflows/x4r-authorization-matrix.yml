name: X4R Authorization Test Matrix (ephemeral, local Supabase)

# IVE-X4R Gate 1C. Runs the full A-O dynamic authorization test matrix
# against a Postgres instance that lives entirely inside this runner
# (supabase start), never against any real Supabase project. No job in
# this file declares or uses SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF,
# or any service_role/anon key. Triggered by push to this feature branch
# only -- not workflow_dispatch, per owner decision (a new workflow file
# cannot be workflow_dispatch-triggered until it exists on the default
# branch, and merging to main to work around that is explicitly
# prohibited for this mission). workflow_dispatch is kept as a secondary
# trigger for a future manual re-run once this file exists on a branch
# GitHub already recognizes it on -- push is what makes this run today.

on:
  push:
    branches:
      - claude/ive-x4-security-boundary-closure
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/x4b_authorization_tests.sql'
      - 'supabase/tests/x4r_authorization_matrix_completion.sql'
      - '.github/workflows/x4r-authorization-matrix.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  authorization-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # No `ref:` -- tests exactly the commit (github.sha) that
        # triggered this run, whatever it ends up being.

      - name: Record commit under test
        run: |
          echo "Testing commit: ${{ github.sha }}" | tee test_summary.log

      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0 # pinned; latest stable non-beta as of 2026-09-06

      - name: Install postgresql-client (psql)
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client

      - name: Log environment versions
        run: |
          { supabase --version; docker --version; docker compose version || true; psql --version; } \
            | tee environment_versions.log

      - name: Ephemeral runner-only migration filename workaround (IVE-X4R Gate 1E)
        run: |
          set -euo pipefail
          ORIGINAL="supabase/migrations/001_create_post_generations.sql"
          TEMP="supabase/migrations/000_create_post_generations.sql"
          # Computed outside any pipe on purpose: a `{ ... } | tee` block runs
          # the left side in a subshell, so a variable assigned inside it
          # would not survive for the comparison below.
          ORIGINAL_SHA256=$(sha256sum "$ORIGINAL" | awk '{print $1}')
          {
            echo "PURPOSE: production's supabase_migrations bookkeeping is empty for"
            echo "all 22 migrations (Gate 1D finding) -- separately, this repo has two"
            echo "files both using version prefix 001 (001_create_post_generations.sql"
            echo "and 001_platform_schema.sql), which collides in the CLI's"
            echo "supabase_migrations.schema_migrations bookkeeping the moment a fresh"
            echo "local instance tries to apply both. This step works around that"
            echo "collision ONLY inside this disposable runner's working tree -- the"
            echo "committed files on the branch are never touched, nothing here is"
            echo "'git add'-ed, committed, or pushed."
            echo
            echo "ORIGINAL_FILENAME=$ORIGINAL"
            echo "TEMP_FILENAME=$TEMP"
            echo "ORIGINAL_SHA256=$ORIGINAL_SHA256"
          } | tee migration_workaround.log

          mv "$ORIGINAL" "$TEMP"

          TEMP_SHA256=$(sha256sum "$TEMP" | awk '{print $1}')
          echo "TEMP_CONTENT_SHA256=$TEMP_SHA256" | tee -a migration_workaround.log

          if [ "$ORIGINAL_SHA256" != "$TEMP_SHA256" ]; then
            echo "ABORT: content hash changed across rename -- this must never happen for a plain mv" \
              | tee -a migration_workaround.log
            exit 1
          fi
          echo "OK: content is byte-identical before and after rename." | tee -a migration_workaround.log

          echo "-- final ordered migration filename list used by supabase start --" \
            | tee -a migration_workaround.log
          ls -1 supabase/migrations/ | sort | tee -a migration_workaround.log

          echo "-- confirming nothing was staged/committed in git (working tree only) --" \
            | tee -a migration_workaround.log
          git status --short | tee -a migration_workaround.log
          if [ -n "$(git status --short)" ]; then
            echo "Expected: exactly the rename above shows as untracked/deleted in the" \
              | tee -a migration_workaround.log
            echo "working tree; nothing has been staged with 'git add'." \
              | tee -a migration_workaround.log
          fi

      - name: Start local Supabase stack (applies all committed migrations)
        run: supabase start

      - name: Safety check -- local-only, no production reference
        run: |
          STATUS=$(supabase status)
          echo "$STATUS"
          echo "$STATUS" | grep -q "127.0.0.1" || { echo "REFUSING: not a local instance"; exit 1; }
          if echo "$STATUS" | grep -qi "nzngvbajrnruknpzzjbf"; then
            echo "REFUSING: production project ref detected in local status"; exit 1
          fi
          if env | grep -iE "SUPABASE_ACCESS_TOKEN|SUPABASE_PROJECT_REF|SERVICE_ROLE_KEY"; then
            echo "REFUSING: production-shaped secret name present in job environment"; exit 1
          fi
          echo "OK: local-only instance, no production reference or secret found."

      - name: Confirm migration 022 objects applied (not assumed)
        run: |
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          {
            echo "-- full trigger definition on public.profiles (timing + events) --"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -c \
              "SELECT tgname, pg_get_triggerdef(oid) FROM pg_trigger WHERE tgrelid = 'public.profiles'::regclass AND NOT tgisinternal;"
            echo "-- SECURITY INVOKER/DEFINER + search_path on every function migration 022 touches or adds --"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -c \
              "SELECT proname, CASE WHEN prosecdef THEN 'DEFINER' ELSE 'INVOKER' END AS security, proconfig FROM pg_proc WHERE pronamespace='public'::regnamespace AND proname IN ('prevent_self_privilege_escalation','is_admin_user','handle_new_user','set_updated_at','update_project_events_updated_at','update_executive_contexts_updated_at') ORDER BY proname;"
            echo "-- full body of the new trigger function (for direct visual confirmation of the TG_OP branches) --"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -c \
              "SELECT pg_get_functiondef(oid) FROM pg_proc WHERE pronamespace='public'::regnamespace AND proname='prevent_self_privilege_escalation';"
          } | tee migration_evidence.log

          grep -q "trg_prevent_self_privilege_escalation" migration_evidence.log \
            || { echo "REFUSING: expected trigger not found -- migration 022 not applied to this local instance"; exit 1; }
          grep -q "BEFORE INSERT OR UPDATE" migration_evidence.log \
            || { echo "REFUSING: trigger exists but is not BEFORE INSERT OR UPDATE -- wrong version of migration 022"; exit 1; }

          # Dedicated boolean query, not a text-grep on the formatted table
          # above (that log has multiple mentions of the function name, so a
          # grep -A on it could accidentally match the wrong row).
          IS_INVOKER=$(psql "$DB_URL" -tA -v ON_ERROR_STOP=1 -c \
            "SELECT NOT prosecdef FROM pg_proc WHERE pronamespace='public'::regnamespace AND proname='prevent_self_privilege_escalation';")
          echo "prevent_self_privilege_escalation is SECURITY INVOKER: $IS_INVOKER" | tee -a migration_evidence.log
          [ "$IS_INVOKER" = "t" ] \
            || { echo "REFUSING: prevent_self_privilege_escalation is not SECURITY INVOKER -- wrong version of migration 022"; exit 1; }

          SEARCH_PATH_COUNT=$(psql "$DB_URL" -tA -v ON_ERROR_STOP=1 -c \
            "SELECT count(*) FROM pg_proc WHERE pronamespace='public'::regnamespace AND proname IN ('is_admin_user','handle_new_user','set_updated_at','update_project_events_updated_at','update_executive_contexts_updated_at') AND proconfig @> ARRAY['search_path=public'];")
          echo "functions with search_path=public hardened: $SEARCH_PATH_COUNT / 5" | tee -a migration_evidence.log
          [ "$SEARCH_PATH_COUNT" = "5" ] \
            || { echo "REFUSING: not all 5 expected functions have search_path hardened -- wrong version of migration 022"; exit 1; }

          echo "OK: migration 022 (X4R-corrected version) confirmed applied to this local instance." | tee -a migration_evidence.log

      - name: Run x4b_authorization_tests.sql
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 \
            -f supabase/tests/x4b_authorization_tests.sql 2>&1 | tee x4b_results.log

      - name: Run x4r_authorization_matrix_completion.sql
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 \
            -f supabase/tests/x4r_authorization_matrix_completion.sql 2>&1 | tee x4r_completion_results.log

      - name: Build test summary
        if: always()
        run: |
          {
            echo "commit_sha=${{ github.sha }}"
            echo "--- x4b_authorization_tests.sql: PASS/FAIL/NOTICE lines ---"
            grep -E "NOTICE|PASS|FAIL" x4b_results.log || echo "(no output captured -- see full log)"
            echo "--- x4r_authorization_matrix_completion.sql: PASS/FAIL/NOTICE lines ---"
            grep -E "NOTICE|PASS|FAIL" x4r_completion_results.log || echo "(no output captured -- see full log)"
          } | tee test_summary.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: x4r-authorization-matrix-results
          path: |
            environment_versions.log
            migration_workaround.log
            migration_evidence.log
            x4b_results.log
            x4r_completion_results.log
            test_summary.log
          retention-days: 14

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup
