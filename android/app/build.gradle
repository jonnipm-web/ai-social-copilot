plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.insightvalues.aisocialcopilot"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11
    }

    defaultConfig {
        applicationId "com.insightvalues.aisocialcopilot"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    // ── Flavors ────────────────────────────────────────────────────────────────
    // production  — InsightValues principal
    // iveAvatarLab — APK isolado de avaliação (applicationId separado)
    //
    // Build do laboratório (sem keystore, sem secrets de produção):
    //   flutter build apk --debug \
    //     --flavor iveAvatarLab \
    //     --target lib/main_ive_avatar_lab.dart

    flavorDimensions "variant"

    productFlavors {
        production {
            dimension "variant"
            applicationId "com.insightvalues.aisocialcopilot"
            resValue "string", "app_name", "InsightValues"
        }

        iveAvatarLab {
            dimension "variant"
            applicationId "com.insightvalues.iveavatarlab"
            versionName "0.1.0"
            versionCode 1
            resValue "string", "app_name", "IVE Avatar Lab"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source "../.."
}

// ── Google Services e Firebase ────────────────────────────────────────────────
// O plugin google-services é aplicado apenas para o flavor production.
// O flavor iveAvatarLab não usa Firebase: sem Auth, sem Analytics, sem Drive.
// A task processGoogleServices é suprimida para o flavor iveAvatarLab.

apply plugin: "com.google.gms.google-services"

afterEvaluate {
    // Desabilitar processamento de google-services para todas as variantes do lab
    android.applicationVariants.all { variant ->
        if (variant.flavorName == "iveAvatarLab") {
            def taskName = "process${variant.name.capitalize()}GoogleServices"
            def task = tasks.findByName(taskName)
            if (task != null) {
                task.enabled = false
            }
        }
    }
}

dependencies {
    // Firebase BOM — compilado apenas para production via configuração de variant
    productionImplementation platform("com.google.firebase:firebase-bom:33.7.0")
    productionImplementation "com.google.firebase:firebase-analytics"
}
