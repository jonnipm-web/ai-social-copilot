# IV-ECOSYSTEM-COMMERCIAL-RELEASE-SUPERMACRO-01 — D2
# Per-flavor version catalog for InsightValues Android apps.
#
# com.insightvalues.core, .impact, and .quant are SEPARATE Play Store apps.
# Their versionCode sequences are INDEPENDENT of each other.
#
# RULES:
#   1. versionCode MUST be a strictly monotonic integer.
#      Increment before each Play Store upload for that product.
#   2. versionName follows semantic versioning: MAJOR.MINOR.PATCH
#   3. pubspec.yaml version is ignored for flavor builds (overridden here).
#   4. Increment ONLY the product being updated — leave others untouched.
#   5. Never set versionCode to 0. Play Store rejects versionCode < 1.
#   6. After upload, record the new versionCode here and commit.
#
# HISTORY:
#   core    1 — initial release (SUPERMACRO-01 FASE D)
#   impact  1 — initial release (SUPERMACRO-01 FASE D)
#   quant   1 — initial release (SUPERMACRO-01 FASE D)

core.versionCode=1
core.versionName=1.0.0

impact.versionCode=1
impact.versionName=1.0.0

quant.versionCode=1
quant.versionName=1.0.0
