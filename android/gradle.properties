android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# ANDROID-16KB-PAGE-SIZE (Gate-17-Final-Closure Section 06) — rive_common's
# own android/build.gradle compiles librive_text.so from source using
# ndkVersion = project.getProperty('rive.ndk.version') ?: "25.1.8937393"
# (see pub cache: rive_common-0.4.15/android/build.gradle). NDK r25 predates
# 16KB-page-aligned-by-default linking (introduced NDK r27+, default in r28+),
# which is why librive_text.so came out of the release APK 4KB-aligned
# (align 2**12 via llvm-objdump) while every other native library in the
# same APK (libflutter.so, libapp.so, libdartjni.so — all Flutter-managed,
# ndkVersion = flutter.ndkVersion = 28.2.13676358) was already correctly
# aligned. This pins rive_common's own separate native build to the same
# already-installed NDK r28 the rest of the app uses, rather than upgrading
# any dependency version.
rive.ndk.version=28.2.13676358
# rive_common's own android/build.gradle hardcodes minSdkVersion 19
# (pub cache: rive_common-0.4.15/android/build.gradle:49) regardless of the
# app's real minSdk (24, from flutter.minSdkVersion in app/build.gradle.kts).
# NDK r28 dropped support for compiling against platform 19 (CXX1110); AGP's
# own error message names this exact suppress flag as the sanctioned escape
# hatch when the real app minSdk (24) is already above the flag's floor (21) —
# this does not lower the app's actual minSdk, only silences NDK's complaint
# about rive_common's own stale internal target.
android.ndk.suppressMinSdkVersionError=21
