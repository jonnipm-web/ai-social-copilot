name: ai_social_copilot
description: AI-powered social media post copilot.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # IVE-COMMERCIAL-RELEASE-CONTROL-PLANE-01 — i18n PT/EN oficial do Flutter
  # (flutter_localizations + gen-l10n). Nenhum sistema de i18n existia antes
  # desta missão (auditado: sem pacote intl/easy_localization/l10n em uso).
  flutter_localizations:
    sdk: flutter

  # Supabase — fixado em <2.15.0 para evitar dependência no passkeys_web (crasha no GitHub Pages)
  supabase_flutter: ">=2.5.6 <2.15.0"

  # Estado
  flutter_riverpod: ^2.5.1

  # Navegação
  go_router: ^14.2.7

  # UI utilitários
  google_fonts: ^6.2.1
  shimmer: ^3.0.0

  # Env / config
  flutter_dotenv: ^5.1.0

  # Google Drive integration
  google_sign_in: ^6.2.1
  http: ^1.2.1

  # IVE Memory Layer — persistência local
  shared_preferences: ^2.3.0

  # IVE Visual Runtime — Rive character integration
  rive: ^0.13.12

  # File import (Smart Import Engine)
  # TODAS as versoes estaveis de file_picker (5.x–11.x) dependem de win32 ^2–5,
  # incompativel com device_info_plus ^13 e package_info_plus ^10 (win32 ^6).
  # A versao 12.0.0-beta.1 e a primeira a usar win32 ^6 — unica opcao compativel.
  file_picker: ">=12.0.0-beta.1"

  # IVE-COMMERCIAL-BILLING-01 — abre o Stripe Checkout Session URL.
  # url_launcher_web (abaixo, em dependency_overrides) já era resolvido
  # transitivamente via google_sign_in; isto só declara o pacote guarda-
  # chuva explicitamente para poder importá-lo diretamente.
  url_launcher: ^6.3.1

  # IVE-COMMERCIAL-RELEASE-CONTROL-PLANE-01 — versão/build para a tela
  # "Sobre" (About). Já era resolvido transitivamente via
  # dependency_overrides abaixo; declarado direto para poder importar.
  package_info_plus: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4

# Forçar versões mais novas dos plugins web para corrigir null check
dependency_overrides:
  url_launcher_web: ^2.4.3
  app_links: ^7.0.0
  device_info_plus: ^13.0.0
  package_info_plus: ^10.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - .env
    - assets/ive/reference/
    - assets/ive/rive/
